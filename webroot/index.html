<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>挂载自愈</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f5f7; --card:#ffffff; --fg:#15171b; --muted:#6b7280;
  --line:#e6e8ec; --line2:#f3f4f6;
  --accent:#5159d8; --on-accent:#ffffff;
  --good:#15803d; --good-bg:#e8f6ee;
  --warn:#b45309; --warn-bg:#fdf3e4;
  --bad:#b91c1c;  --bad-bg:#fdecec;
  --info:#1d4ed8; --info-bg:#e9efff;
  --radius:14px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d0f12; --card:#16191e; --fg:#e9ebee; --muted:#9aa2ad;
    --line:#272b32; --line2:#1d2126;
    --accent:#7c83f5; --on-accent:#0d0f12;
    --good:#4ade80; --good-bg:#12251a;
    --warn:#fbbf24; --warn-bg:#2a2010;
    --bad:#f87171;  --bad-bg:#2a1414;
    --info:#7aa2ff; --info-bg:#141b2e;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","PingFang SC",system-ui,sans-serif;
  font-size:14px;line-height:1.5;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(26px + env(safe-area-inset-bottom));
  max-width:720px;margin:0 auto;
}
h1,h2{margin:0;font-weight:600}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:2px 2px 14px}
.t1{font-size:17px;font-weight:600;letter-spacing:.2px}
.t2{font-size:12px;color:var(--muted);margin-top:2px}
.t2 .sep{margin:0 5px;opacity:.5}
.title-row{min-width:0}
.pill{
  flex:none;display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--line2);color:var(--muted);white-space:nowrap;
}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-head h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.6px}
.card-head .muted,.muted{color:var(--muted)}
.small{font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--line2);border-radius:10px;padding:9px 11px;min-width:0}
.metric .label{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .value{font-size:20px;font-weight:650;line-height:1.25;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .value.small-v{font-size:15px;font-weight:600}
.metric.good .value{color:var(--good)}
.metric.warn .value{color:var(--warn)}
.metric.bad .value{color:var(--bad)}
.kv{margin-top:10px}
.kv .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv .row:last-child{border-bottom:0}
.kv .k{color:var(--muted);font-size:12.5px;flex:none}
.kv .v{font-size:12.5px;text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}
.banner{padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner .b-title{font-weight:600;margin-bottom:2px}
.banner .b-item + .b-item{margin-top:8px;padding-top:8px;border-top:1px dashed currentColor;opacity:.95}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 10px}
.switch-row span{font-size:14px}
.switch-row input{position:absolute;opacity:0;pointer-events:none}
.switch-row i{
  flex:none;width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;transition:background .18s;
}
.switch-row i::after{
  content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .18s;
}
.switch-row input:checked + i{background:var(--accent)}
.switch-row input:checked + i::after{transform:translateX(19px)}
.switch-row input:disabled + i{opacity:.45}
.switch-row input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
button:focus-visible,input:focus-visible,summary:focus-visible,pre:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
.field-label{display:flex;align-items:center;gap:6px;font-size:12.5px;margin:12px 0 6px;color:var(--fg)}
.field-label .muted{margin-left:auto;font-size:11.5px}
code{font-family:var(--mono);font-size:11px;background:var(--line2);color:var(--muted);border-radius:5px;padding:1px 5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line2);border-radius:10px;padding:3px}
.seg button{
  appearance:none;border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:13px;padding:8px 0;border-radius:8px;cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.5}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.stepper button{
  appearance:none;height:40px;border:1px solid var(--line);background:transparent;color:var(--fg);
  border-radius:10px;font-size:18px;line-height:1;cursor:pointer;
}
.stepper button:active{background:var(--line2)}
.stepper input{
  appearance:textfield;-moz-appearance:textfield;width:100%;height:40px;text-align:center;
  border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);
  font:inherit;font-size:15px;font-variant-numeric:tabular-nums;
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input.bad{border-color:var(--bad);color:var(--bad)}
.stepper button:disabled,.stepper input:disabled{opacity:.45}
.field-error{color:var(--bad);font-size:12px;margin-top:5px}
.hint{background:var(--warn-bg);color:var(--warn);border-radius:9px;padding:9px 11px;font-size:12.5px;margin-bottom:10px}
.row-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.btn{
  appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);
  font:inherit;font-size:13.5px;height:42px;border-radius:11px;padding:0 14px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.tiny{height:30px;font-size:12.5px;padding:0 10px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.act-btn{height:44px;min-width:120px;padding:0 16px;font-size:13.5px;border-radius:11px;margin:0}
.btn[disabled]{opacity:.42;cursor:default;transform:none}
.btn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.row-actions .act-btn{flex:1 1 120px}
#patchCard .card-head{align-items:flex-start;flex-wrap:wrap;gap:6px 10px}
#patchCard .card-head h2{flex:1 1 auto;min-width:0;line-height:1.35;overflow-wrap:anywhere}
#patchBadge{flex:none;margin-left:auto;text-align:right;white-space:nowrap;line-height:1.6}
#patchDetail{overflow-wrap:anywhere}
#patchActions{margin-top:14px}
#patchTiming{display:block;margin-top:8px;line-height:1.4;overflow-wrap:anywhere}
.result{margin-top:12px;background:var(--line2);border-radius:10px;padding:10px 12px;font-size:12.5px}
.result.good{background:var(--good-bg);color:var(--good)}
.result.warn{background:var(--warn-bg);color:var(--warn)}
.result.bad{background:var(--bad-bg);color:var(--bad)}
.result.info{background:var(--info-bg);color:var(--info)}
.result .r-title{font-weight:600;margin-bottom:3px}
.result .r-body{color:var(--fg);opacity:.86;white-space:pre-wrap;word-break:break-word;margin-top:3px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.tbl th{text-align:left;font-size:11.5px;font-weight:500;color:var(--muted);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .app{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.tbl .st{width:74px;text-align:right}
.chip{display:inline-block;font-size:11px;line-height:1.6;padding:1px 7px;border-radius:999px;background:var(--line2);color:var(--muted);margin:2px 4px 2px 0}
.chip.ok{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.na{background:var(--line2);color:var(--muted)}
.st.done{color:var(--good);font-weight:600}
.st.miss{color:var(--bad);font-weight:600}
.st.off{color:var(--muted)}
pre{
  margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.6;white-space:pre-wrap;word-break:break-all;
  background:var(--line2);border-radius:10px;padding:10px;max-height:300px;overflow:auto;
}
details.card summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:8px}
.empty{color:var(--muted);font-size:12.5px;padding:10px 0}
.spin{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1 class="t1">存储空间隔离 · 挂载自愈</h1>
    <div class="t2"><span id="ver">v—</span><span class="sep">·</span><span id="bridgeName">桥接检测中…</span></div>
  </div>
  <span class="pill" id="statePill" role="status" aria-live="polite">读取中</span>
</header>

<div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

<section class="card">
  <div class="card-head"><h2>状态</h2><span class="muted small" id="stamp">—</span></div>
  <div class="grid2" id="metrics"></div>
  <div class="kv" id="kv"></div>
</section>

<section class="card">
  <div class="card-head"><h2>配置</h2><span class="muted small">config.conf</span></div>
  <div id="cfgHint" class="hint" hidden></div>
  <label class="switch-row">
    <span>启用挂载自愈</span>
    <input type="checkbox" id="cfgEnabled" disabled><i></i>
  </label>
  <div class="field-label">模式偏好 <code>MODE</code></div>
  <div class="seg" id="cfgMode">
    <button type="button" data-mode="auto" disabled>自动</button>
    <button type="button" data-mode="event" disabled>事件</button>
    <button type="button" data-mode="poll" disabled>轮询</button>
  </div>
  <div id="cfgPollGroup" hidden>
    <div class="field-label">轮询间隔 <code>POLL_INTERVAL</code><span class="muted">10–600 秒</span></div>
    <div class="stepper">
      <button type="button" data-step="-1" data-target="cfgInterval" aria-label="减少轮询间隔" disabled>−</button>
      <input id="cfgInterval" type="number" min="10" max="600" step="1" inputmode="numeric" aria-label="轮询间隔（秒）" disabled>
      <button type="button" data-step="1" data-target="cfgInterval" aria-label="增加轮询间隔" disabled>+</button>
    </div>
    <div class="field-error" id="cfgIntervalErr" hidden>轮询间隔需为 10–600 之间的整数</div>
  </div>
  <div class="field-label">最小进程年龄 <code>MIN_AGE</code><span class="muted">5–120 秒</span></div>
  <div class="stepper">
    <button type="button" data-step="-1" data-target="cfgMinAge" aria-label="减少最小进程年龄" disabled>−</button>
    <input id="cfgMinAge" type="number" min="5" max="120" step="1" inputmode="numeric" aria-label="最小进程年龄（秒）" disabled>
    <button type="button" data-step="1" data-target="cfgMinAge" aria-label="增加最小进程年龄" disabled>+</button>
  </div>
  <div class="field-error" id="cfgMinAgeErr" hidden>最小进程年龄需为 5–120 之间的整数</div>
  <div class="row-actions" id="cfgActions" hidden>
    <button class="btn primary act-btn" id="cfgSave" disabled>保存并重启守护</button>
    <button class="btn ghost act-btn" id="cfgDiscard" disabled>撤销</button>
  </div>
</section>

<section class="card">
  <div class="card-head"><h2>操作</h2><span class="muted small" id="opStamp"></span></div>
  <div class="btn-grid">
    <button class="btn ghost act-btn" id="btnRefresh">刷新</button>
    <button class="btn ghost act-btn" id="btnCheck" disabled>体检</button>
    <button class="btn primary act-btn" id="btnFix" disabled>立即修复</button>
    <button class="btn ghost act-btn" id="btnRestart" disabled>重启守护</button>
  </div>
  <div id="opResult" class="result" role="status" aria-live="polite" hidden></div>
</section>

<section class="card" id="patchCard" hidden>
  <div class="card-head"><h2>Android 17 应用列表与导出修复（main.dex）</h2><span class="muted small" id="patchBadge"></span></div>
  <div id="patchHint" class="hint" hidden></div>
  <div class="muted small" id="patchDetail">—</div>
  <div class="btn-grid" id="patchActions" hidden>
    <button class="btn primary act-btn" id="btnPatchApply" disabled>应用补丁</button>
    <button class="btn ghost act-btn" id="btnPatchRestore" hidden disabled>恢复原版</button>
    <button class="btn danger act-btn" id="btnPatchForce" hidden disabled>强制恢复</button>
    <button class="btn ghost act-btn" id="btnPatchCheck" disabled>检查补丁</button>
  </div>
  <div class="muted small" id="patchTiming">—</div>
  <div id="patchConfirm" class="result warn" role="alert" hidden>
    <div class="r-title" id="patchConfirmTitle"></div>
    <div class="r-body" id="patchConfirmBody"></div>
    <div class="btn-grid">
      <button class="btn primary act-btn" id="btnPatchConfirmGo" disabled>确认执行</button>
      <button class="btn ghost act-btn" id="btnPatchConfirmCancel">取消</button>
    </div>
  </div>
  <div id="patchResult" class="result" role="status" aria-live="polite" hidden></div>
</section>

<section class="card">
  <div class="card-head"><h2>应用与可访问目录</h2><button class="btn tiny ghost" id="btnApps" disabled>读取</button></div>
  <div class="muted small" id="appsSum">未读取</div>
  <div id="appsBody"></div>
</section>

<section class="card">
  <div class="card-head"><h2>日志</h2><button class="btn tiny ghost" id="btnLog" disabled>重新加载</button></div>
  <pre id="logBox" tabindex="0" aria-label="守护进程日志">（未加载）</pre>
  <div class="muted small" id="logStamp"></div>
</section>

<details class="card">
  <summary>诊断</summary>
  <div class="kv" id="diag"></div>
</details>

<script>
/* 只读快照：守护进程定期写入 webroot/snapshot.js，没有 WebUI 桥接时也能显示状态 */
(function(){
  try{document.write('<script src="snapshot.js?t=' + Date.now() + '"><\/script>');}catch(e){}
})();
</script>

<script>
(function () {
  'use strict';

  /* ============================================================
     常量
     ============================================================ */
  /* 模块路径集中在这里；改目录只动这一处 */
  var ADB = '/data/adb';
  var D = ADB + '/si-mount-fix';
  var MODDIR = ADB + '/modules/si-mount-fix';
  var P = {
    status: D + '/status.json',
    config: D + '/config.conf',
    log: D + '/daemon.log',
    mod: MODDIR
  };
  P.fix = P.mod + '/scripts/fix-si-mounts.sh';
  P.restart = P.mod + '/scripts/restart.sh';
  P.list = P.mod + '/scripts/list-apps.sh';
  P.patch = P.mod + '/scripts/si-patch.sh';

  var POLL_MS = 8000;
  var CMD_TIMEOUT = 35000;
  var CHECK_TIMEOUT = 8000;
  var FIX_TIMEOUT = 30000;
  var RESTART_TIMEOUT = 10000;
  var PATCH_ACTION_TIMEOUT = 10000;
  var PATCH_CACHE_TTL = 30000;
  var BG_POLL_MS = 300;
  var BRIDGE_FAIL_LIMIT = 3;   /* 连续失败 N 次：桥接判定失效，回落只读快照 */
  var REPROBE_MS = 20000;      /* 只读模式下重新探测桥接的最小间隔 */
  var SNAPSHOT_STALE = 600;    /* 快照超过 10 分钟没更新，视为守护已停 */

  var MODE_CHIP = {
    event: { label: '事件驱动', tone: 'good' },
    poll: { label: '轮询', tone: 'warn' },
    starting: { label: '启动中', tone: 'info' },
    off: { label: '已停止', tone: 'warn' }
  };

  /* 本地兜底词表：只在 status.json 没有 reason_text（旧版守护）时使用。
     文案与守护进程 reason_label() 保持同义；新原因优先由 daemon 提供。
     原因里可能带 "+tag" 后缀（如 xxx+forced_event_unsupported），见 reasonText()。 */
  var REASON_LABEL = {
    ok: '正常',
    boot: '启动中',
    disabled: '已停用',
    tracefs_missing: '缺少 tracefs，已降级轮询',
    kprobe_failed: 'kprobe 注册失败，已降级轮询',
    selftest_failed: '事件自检失败，已降级轮询',
    pipe_busy: '事件通道被占用',
    pipe_open_error: '事件通道打不开（无占用者），已降级轮询',
    pipe_closed: '事件通道关闭',
    trace_reset: 'trace 被重置，已自动恢复',
    forced_poll: '配置要求轮询',
    forced_event_unsupported: '配置要求事件但环境不支持，已降级轮询',
    skipped_locked: '另一轮修复正在进行，稍后重试',
    blind: '事件通道异常（收不到事件），建议重启手机',
    boot_wait: '开机等待 FUSE 就绪（自动退避重试）',
    fuse_missing: 'FUSE 层未就绪（fail-closed，持续重试）',
    launch_failed: '守护进程启动失败，请查看 daemon.log'
  };

  var STYLE_LABEL = { cb3: '回调（3 参）', cb2: '回调（2 参）', sync: '同步字符串' };

  /* fix 的 RESULT skipped=tag+tag：tag 来自 scripts/result.sh 契约，未知 tag 原样显示 */
  var SKIP_LABEL = {
    locked: '另一轮修复进行中',
    disabled: '应用未启用',
    identity: '沙箱身份不符（需重启应用）',
    layer: '挂载层级不符',
    source: '源目录不存在',
    source_ns: '应用内看不到源',
    bindfail: '绑定挂载失败',
    sandbox_gone: '沙箱丢失（会尝试重建）',
    sandbox_stale: '沙箱僵死（需重启应用）',
    sandbox_skip: '沙箱未重建（安全拒绝，需重启应用）',
    na: '不是隔离对象（isolated/无 storage，无需重建）',
    rollback: '回滚未卸干净（需重启应用）',
    churn: '频繁被拆已熔断',
    template: '未知模板 id',
    dir_space: '目录名无法安全表示',
    dir_invalid: '目录路径不合法',
    target_missing: '锚点/目标目录缺失',
    pid_changed: '进程已变化（需重新扫描）'
  };

  function skipText(tags) {
    var arr = String(tags || '').split('+');
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      var t = arr[i];
      if (!t) { continue; }
      out.push(SKIP_LABEL[t] || t);
    }
    return out.join('、');
  }

  /* fix 的 RESULT error=token；未知 token 原样显示 */
  var ERROR_LABEL = {
    datadir: '数据目录不可写',
    config: '配置不可读或格式不对',
    ps: '进程列表读取失败',
    scan: '扫描失败',
    timeout: '执行超时'
  };

  function errorText(code) {
    var c = String(code || '');
    if (ERROR_LABEL[c]) { return ERROR_LABEL[c]; }
    if (c.indexOf('exit') === 0) { return '脚本异常退出（' + c + '）'; }
    return c || '未知错误';
  }

  /* ============================================================
     DOM / 工具
     ============================================================ */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toInt(v, d) { var n = parseInt(v, 10); return isFinite(n) ? n : (d || 0); }
  function nowSec() { return Math.floor(Date.now() / 1000); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function clock(ts) {
    if (!ts) { return '—'; }
    var d = new Date(ts * 1000);
    return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function rel(ts) {
    if (!ts) { return '—'; }
    var s = nowSec() - ts;
    if (s < 0) { s = 0; }
    if (s < 60) { return s + ' 秒前'; }
    if (s < 3600) { return Math.floor(s / 60) + ' 分钟前'; }
    if (s < 86400) { return Math.floor(s / 3600) + ' 小时前'; }
    return Math.floor(s / 86400) + ' 天前';
  }
  function dur(sec) {
    sec = Math.max(0, toInt(sec, 0));
    if (sec < 60) { return sec + ' 秒'; }
    if (sec < 3600) { return Math.floor(sec / 60) + ' 分'; }
    if (sec < 86400) { return Math.floor(sec / 3600) + ' 小时 ' + Math.floor((sec % 3600) / 60) + ' 分'; }
    return Math.floor(sec / 86400) + ' 天 ' + Math.floor((sec % 86400) / 3600) + ' 小时';
  }
  function setBanner(html, tone) {
    var el = $('banner');
    if (!html) { el.hidden = true; el.innerHTML = ''; return; }
    el.className = 'banner ' + (tone || 'info');
    el.innerHTML = html;
    el.hidden = false;
  }

  /* 多条提示合并成一个 banner：tone 取最严重的，正文一律 esc()。
     item: {title, body, tone, action?, actionLabel?, actions?: [{action,label}]}；
     action 由 boot 里的委托监听处理。 */
  var TONE_RANK = { info: 0, warn: 1, bad: 2 };
  function setBannerItems(items) {
    items = (items || []).filter(Boolean);
    if (!items.length) { setBanner('', 'info'); return; }
    var tone = 'info';
    var html = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (TONE_RANK[it.tone] > TONE_RANK[tone]) { tone = it.tone; }
      var one = '<div class="b-title">' + esc(it.title) + '</div>' +
        (it.body ? '<div>' + esc(it.body) + '</div>' : '');
      var acts = (it.actions && it.actions.length) ? it.actions
        : (it.action ? [{ action: it.action, label: it.actionLabel || '重试' }] : []);
      if (acts.length) {
        one += '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">';
        for (var j = 0; j < acts.length; j++) {
          one += '<button type="button" class="btn tiny ghost" data-action="' +
            esc(acts[j].action) + '">' + esc(acts[j].label) + '</button>';
        }
        one += '</div>';
      }
      html.push('<div class="b-item">' + one + '</div>');
    }
    setBanner(html.join(''), tone);
  }

  /* ============================================================
     桥接层：三种形态都要兼容
       cb3  exec(cmd, optionsJson, callbackName)   KernelSU / WebUI-Next / KsuWebUI
       cb2  exec(cmd, callbackName)                 KsuWebUI 旧版
       sync exec(cmd) -> String                     WebUI-Next / KsuWebUI（会阻塞）
     探测一次，记住能用的那种。
     ============================================================ */
  var BR = { obj: null, name: '', style: '', ok: false, note: '', latency: 0, error: '', fails: 0, probing: false, probeP: null };
  var cbSeq = 0;

  function normalize(res) {
    /* sync 桥接只回字符串，拿不到退出码：errno 必须标成未知，不能伪装成 0。
       否则 apply/restore 失败也会被当成成功（绿条），只能靠事后再跑 check 判真伪。 */
    if (typeof res === 'string') { return { errno: null, errnoKnown: false, stdout: res, stderr: '' }; }
    if (!res || typeof res !== 'object') { return { errno: null, errnoKnown: false, stdout: '', stderr: '' }; }
    return {
      errno: toInt(res.errno, 0),
      errnoKnown: true,
      stdout: typeof res.stdout === 'string' ? res.stdout : (res.stdout == null ? '' : String(res.stdout)),
      stderr: typeof res.stderr === 'string' ? res.stderr : (res.stderr == null ? '' : String(res.stderr))
    };
  }

  function rawCall(style, cmd, waitMs) {
    return new Promise(function (resolve) {
      if (!BR.obj) { resolve(null); return; }
      var name = '__SI_CB_' + (++cbSeq);
      var done = false;
      var timer = null;

      function finish(v) {
        if (done) { return; }
        done = true;
        if (timer) { clearTimeout(timer); }
        try { delete window[name]; } catch (e) { /* noop */ }
        resolve(v);
      }

      window[name] = function (errno, stdout, stderr) {
        finish({ errno: toInt(errno, 0), stdout: String(stdout == null ? '' : stdout), stderr: String(stderr == null ? '' : stderr) });
      };

      if (waitMs > 0) {
        timer = setTimeout(function () {
          /* 桥接可能在 JS 线程上同步阻塞，定时器会被推迟到命令返回后才执行。
             这里再给 5 秒宽限，避免"其实已经成功"却报超时。 */
          timer = setTimeout(function () { finish(null); }, 5000);
        }, waitMs);
      }

      var ret;
      try {
        if (style === 'cb3') { ret = BR.obj.exec(cmd, '{}', name); }
        else if (style === 'cb2') { ret = BR.obj.exec(cmd, name); }
        else { ret = BR.obj.exec(cmd); }
      } catch (e) {
        BR.error = String(e && e.message ? e.message : e);
        finish(null);
        return;
      }

      if (ret && typeof ret.then === 'function') {
        ret.then(function (r) { finish(normalize(r)); }, function (e) {
          BR.error = String(e && e.message ? e.message : e);
          finish(null);
        });
        return;
      }
      if (typeof ret === 'string') {
        finish({ errno: null, errnoKnown: false, stdout: ret, stderr: '' });
        return;
      }
      if (ret && typeof ret === 'object') { finish(normalize(ret)); return; }
      /* undefined：等回调 */
    });
  }

  function candidates() {
    var out = [];
    var keys = ['ksu', 'ksuwebui', 'magisk'];
    for (var i = 0; i < keys.length; i++) {
      var o = null;
      try { o = window[keys[i]]; } catch (e) { o = null; }
      if (o && typeof o.exec === 'function') { out.push({ name: keys[i], obj: o }); }
    }
    try {
      if (window.apatch && window.apatch.ksu && typeof window.apatch.ksu.exec === 'function') {
        out.push({ name: 'apatch.ksu', obj: window.apatch.ksu });
      }
    } catch (e2) { /* noop */ }
    return out;
  }

  function probeBridge() {
    /* 单飞：进行中的探测直接复用同一个 Promise。不要用“清 BR.probing 再探测”，
       否则两个探测并发，先返回的旧结果会把刚恢复的实时模式打回只读/锁死按钮。 */
    if (BR.probeP) { return BR.probeP; }
    var list = candidates();
    if (!list.length) { BR.note = '未检测到 WebUI 桥接'; return Promise.resolve(false); }

    BR.probing = true;
    var styles = ['cb3', 'cb2', 'sync'];
    var ci = 0, si = 0;

    function step() {
      if (ci >= list.length) {
        BR.obj = null; BR.name = ''; BR.style = '';
        BR.note = '桥接存在但没有响应';
        return Promise.resolve(false);
      }
      var c = list[ci];
      if (si >= styles.length) { ci++; si = 0; return step(); }
      var st = styles[si++];
      BR.obj = c.obj; BR.name = c.name; BR.style = st;
      return rawCall(st, 'echo __SI_BRIDGE_OK__', 6000).then(function (res) {
        if (res && String(res.stdout || '').indexOf('__SI_BRIDGE_OK__') >= 0) {
          BR.ok = true;
          BR.note = c.name + ' · ' + STYLE_LABEL[st];
          return true;
        }
        return step();
      });
    }
    BR.probeP = step().then(function (v) {
      BR.probing = false;
      BR.probeP = null;
      if (!v) { BR.ok = false; }
      return v;
    }, function (err) {
      BR.probing = false;
      BR.probeP = null;
      BR.ok = false;
      BR.error = String(err && err.message ? err.message : err);
      return false;
    });
    return BR.probeP;
  }

  function run(cmd, waitMs) {
    if (!BR.ok) { return Promise.reject(new Error('未连接桥接')); }
    var wait = waitMs || CMD_TIMEOUT;
    var t0 = Date.now();
    /* 桥接的执行接口可能是同步阻塞的：先让出一帧，把"执行中"画出来再调用 */
    return new Promise(function (resolve, reject) {
      setTimeout(function () { resolve(); }, 50);
    }).then(function () {
      return rawCall(BR.style, cmd, wait);
    }).then(function (res) {
      BR.latency = Date.now() - t0;
      if (!res) { throw new Error('命令无响应（' + Math.round(wait / 1000) + ' 秒超时）'); }
      /* errnoKnown=false 是 sync 桥接：没有退出码，不在这里判失败，交给调用方按输出标记判断。 */
      if (res.errnoKnown !== false && res.errno !== 0 && !String(res.stdout || '').trim()) {
        var e = new Error(String(res.stderr || '').trim() || ('退出码 ' + res.errno));
        /* 带上退出码与输出：补丁动作直接按退出码/输出展示结果，不再跑第二次 check。 */
        e.errno = res.errno; e.errnoKnown = true; e.stdout = res.stdout || '';
        e.stderr = res.stderr || '';
        throw e;
      }
      return res;
    });
  }

  /* 长动作不在 JS 线程里等：先起后台 shell（输出/退出码落盘），再 300ms 轮询一次。
     单次 exec 只有启动/读文件，命令本身再慢也不会卡住界面。 */
  function shq(v) {
    return "'" + String(v == null ? '' : v).replace(/'/g, "'\\''") + "'";
  }

  var bgSeq = 0;

  function cleanupBg(out, rc) {
    if (!BR.ok) { return; }
    run('rm -f ' + shq(out) + ' ' + shq(rc), 3000).catch(function () { /* 清理失败忽略 */ });
  }

  function runBg(cmd, opts) {
    opts = opts || {};
    var timeoutMs = opts.timeoutMs || 10000;
    var pollMs = opts.pollMs || BG_POLL_MS;
    var started = Date.now();
    var base = D + '/.ui-bg-' + started + '-' + (++bgSeq);
    var out = base + '.out';
    var rc = base + '.rc';
    var spawn = 'mkdir -p ' + shq(D) + ' 2>/dev/null; rm -f ' + shq(out) + ' ' + shq(rc) + '; ' +
      '( ' + cmd + '; echo $? > ' + shq(rc) + ' ) > ' + shq(out) + ' 2>&1 < /dev/null &';
    return run(spawn, 5000).then(function () {
      return new Promise(function (resolve) {
        var lastErr = '';
        var lastProgress = 0;
        function finish(res) {
          cleanupBg(out, rc);
          resolve(res);
        }
        function timedOut() {
          /* 不杀后台命令：它可能已经写完，只是没赶上轮询。60 秒后再清临时文件。 */
          setTimeout(function () { cleanupBg(out, rc); }, 60000);
          resolve({ rc: null, out: '', timedOut: true, elapsed: Date.now() - started,
            spawnError: lastErr });
        }
        function poll() {
          if (Date.now() - started > timeoutMs) { timedOut(); return; }
          var pollCmd = 'if [ -f ' + shq(rc) + ' ]; then printf "RC="; cat ' + shq(rc) +
            '; else printf "RC="; fi; printf "\\n@@OUT@@\\n"; tail -c 4000 ' + shq(out) +
            ' 2>/dev/null; true';
          run(pollCmd, 5000).then(function (res) {
            var text = String(res.stdout || '');
            var m = /^RC=([0-9]*)/m.exec(text);
            var rcVal = null;
            if (m && m[1] !== '') { rcVal = parseInt(m[1], 10); }
            var outAt = text.indexOf('@@OUT@@');
            var outText = outAt >= 0 ? text.slice(outAt + 7).replace(/^\n/, '') : '';
            if (rcVal !== null) {
              finish({ rc: rcVal, out: outText, timedOut: false, elapsed: Date.now() - started });
              return;
            }
            if (opts.onProgress && Date.now() - lastProgress > 500) {
              lastProgress = Date.now();
              opts.onProgress(Date.now() - started, outText);
            }
            setTimeout(poll, pollMs);
          }, function (err) {
            lastErr = String(err && err.message ? err.message : err);
            if (Date.now() - started > timeoutMs) { timedOut(); return; }
            setTimeout(poll, pollMs);
          });
        }
        setTimeout(poll, pollMs);
      });
    }, function (err) {
      /* 启动命令没有正常返回：后台可能已经跑起来，按“结果未知”处理。 */
      setTimeout(function () { cleanupBg(out, rc); }, 60000);
      return { rc: null, out: '', timedOut: false, elapsed: Date.now() - started,
        spawnError: String(err && err.message ? err.message : err) };
    });
  }

  /* ============================================================
     状态
     ============================================================ */
  var state = {
    status: null, alive: null, fetchedAt: 0, mode: 'live',
    config: null, configRaw: null, snapshot: null, snapshotTs: 0,
    uid: null, noRoot: false, statusExist: null, statusSize: null,
    apps: null, log: null, busy: false, locked: false, actionBusy: {},
    patch: null, patchError: '', patchSdk: null, patchDismissed: false,
    patchMarked: false, patchMarkedKey: '', patchConfirm: null, patchConfirmTimer: null,
    patchCache: null, patchCheckMs: 0, patchCheckTimedOut: false, patchCheckSource: ''
  };

  /* 一条命令同时取：uid（判断有没有 root）、文件是否存在/多大（区分空文件/没文件）、
     PID 是否还活着、以及 status.json 原文。全都用标记分段，避免命令失败时误判。 */
  var STATUS_CMD = [
    'echo "@@UID@@$(id -u 2>/dev/null || echo x)"',
    'if [ -f ' + P.status + ' ]; then echo "@@EXIST@@1"; echo "@@SIZE@@$(wc -c < ' + P.status + ' 2>/dev/null || echo 0)"; else echo "@@EXIST@@0"; fi',
    'echo "@@PROBE@@"',
    'p=$(sed -n \'s/.*"pid":\\([0-9]*\\).*/\\1/p\' ' + P.status + ' 2>/dev/null | head -1)',
    'if [ -n "$p" ] && [ "$p" -gt 0 ] 2>/dev/null && kill -0 "$p" 2>/dev/null; then echo ALIVE; else echo DEAD; fi',
    'echo "@@JSON@@"',
    'cat ' + P.status + ' 2>/dev/null',
    'true'
  ].join('\n');

  function parseStatusOutput(text) {
    var all = String(text || '');
    var uid = null, exist = null, size = null, alive = null, obj = null;

    var mUid = /@@UID@@\s*(\S*)/.exec(all);
    if (mUid) {
      var u = parseInt(mUid[1], 10);
      uid = isFinite(u) ? u : null;
    }
    var mExist = /@@EXIST@@\s*(\d)/.exec(all);
    if (mExist) { exist = mExist[1] === '1'; }
    var mSize = /@@SIZE@@\s*(\d+)/.exec(all);
    if (mSize) { size = parseInt(mSize[1], 10); }

    var probeAt = all.indexOf('@@PROBE@@');
    var jsonAt = all.indexOf('@@JSON@@');
    var probe = probeAt >= 0 ? all.slice(probeAt + 9, jsonAt >= 0 ? jsonAt : all.length) : '';
    if (/ALIVE/.test(probe)) { alive = true; }
    else if (/DEAD/.test(probe)) { alive = false; }

    var jsonText = jsonAt >= 0 ? all.slice(jsonAt + 8).replace(/^\s+|\s+$/g, '') : '';
    if (jsonText) {
      try { obj = JSON.parse(jsonText); }
      catch (e) {
        try { obj = JSON.parse(jsonText.split('\n').filter(Boolean).pop()); }
        catch (e2) { obj = null; }
      }
    }
    return { obj: obj, alive: alive, uid: uid, exist: exist, size: size, raw: jsonText };
  }

  function isDisabledStatus(s) {
    return !!s && String(s.reason || '') === 'disabled';
  }

  function isBlindStatus(s) {
    /* blind 是“事件模式在跑但收不到事件”；守护退出后（mode=off）BLIND 可能还是 1，
       那种情况要显示「已停止」，不能显示「事件通道异常」。 */
    if (!s || String(s.mode || '') !== 'event') { return false; }
    return toInt(s.blind, 0) === 1 || String(s.reason || '') === 'blind';
  }

  /* 优先用 daemon 写的中文短标签（reason_text）；旧版没有时用本地词表兜底。
     原因可能带 "+tag" 后缀（例如 xxx+forced_event_unsupported），逐段翻译。 */
  function reasonText(s) {
    if (!s) { return '—'; }
    if (typeof s.reason_text === 'string' && s.reason_text) { return s.reason_text; }
    var raw = String(s.reason || '');
    if (!raw) { return '—'; }
    /* 旧 daemon 可能写 "xxx+forced_event_unsupported"：先剥后缀翻基础原因，再统一追加
       说明，否则会出现“已降级轮询；配置要求事件但环境不支持，已降级轮询”的重复。 */
    var suffix = '';
    if (/\+forced_event_unsupported$/.test(raw)) {
      raw = raw.replace(/\+forced_event_unsupported$/, '');
      suffix = '；配置要求事件，但环境不支持';
    }
    var parts = raw.split('+');
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (!p) { continue; }
      if (REASON_LABEL[p]) { out.push(REASON_LABEL[p]); continue; }
      if (p.indexOf('fix_error_') === 0) { out.push('修复脚本异常：' + p.slice(10)); continue; }
      if (p.indexOf('skipped_') === 0) { out.push('本轮跳过：' + p.slice(8)); continue; }
      out.push(p);
    }
    return (out.length ? out.join('；') : '—') + suffix;
  }

  function pillFor(s, alive) {
    if (state.noRoot) { return { label: '无权限', tone: '' }; }
    if (!s) { return { label: '未运行', tone: 'warn' }; }
    /* 停用是预期状态，用中性色，不渲染成故障 */
    if (isDisabledStatus(s)) { return { label: '已停用', tone: '' }; }
    /* blind：事件通道收不到事件，不能再显示绿色「事件驱动」；
       进程已经没了（alive=false）时显示「已停止」更准确，交给下面的判据。 */
    if (isBlindStatus(s) && alive !== false) { return { label: '事件通道异常', tone: 'warn' }; }
    var reason = String(s.reason || '');
    if (reason === 'fuse_missing') { return { label: 'FUSE 未就绪', tone: 'warn' }; }
    if (reason === 'boot_wait') { return { label: '开机等待 FUSE', tone: 'info' }; }
    if (reason === 'launch_failed') { return { label: '启动失败', tone: 'bad' }; }
    if (state.mode === 'snapshot' && alive === false) { return { label: '快照过期', tone: 'warn' }; }
    /* status.json 是上一次写的，可能留着旧状态；PID 没了就按已停止显示 */
    if (alive === false) { return { label: '已停止', tone: 'bad' }; }
    if (s.mode === 'off') { return { label: '已停止', tone: 'warn' }; }
    return MODE_CHIP[s.mode] || { label: s.mode || '未知', tone: 'info' };
  }

  function renderStatus() {
    var s = state.status;
    var alive = state.alive;
    var chip = pillFor(s, alive);

    var pill = $('statePill');
    pill.textContent = chip.label;
    pill.className = 'pill' + (chip.tone ? ' ' + chip.tone : '');

    var m = [];
    var since = s ? toInt(s.since, 0) : 0;
    var lastFix = s ? toInt(s.last_fix, 0) : 0;
    var snapshotStale = state.mode === 'snapshot' && alive === false;

    m.push(metric('运行时长', (s && since && alive !== false) ? dur(nowSec() - since) : '—', ''));
    m.push(metric('守护进程', s && toInt(s.pid, 0) ? ('PID ' + toInt(s.pid, 0)) : '—',
      (alive === false && !snapshotStale) ? 'bad' : ''));
    m.push(metric('本次修复', s ? String(toInt(s.last_fixed, 0)) + ' 条' : '—', toInt(s && s.last_fixed, 0) > 0 ? 'good' : ''));
    /* total_fixed 是守护累计"成功补上的挂载条数"，不是修复轮次 */
    m.push(metric('累计修复', s ? String(toInt(s.total_fixed, 0)) + ' 条' : '—', toInt(s && s.total_fixed, 0) > 0 ? 'good' : ''));
    m.push(metric('隔离进程', s ? String(toInt(s.procs, 0)) + ' 个' : '—', ''));
    m.push(metric('最后事件', s && toInt(s.last_event, 0) ? rel(toInt(s.last_event, 0)) : '—', ''));

    $('metrics').innerHTML = m.join('');

    var kv = [];
    kv.push(row('状态上报', s ? esc(reasonText(s)) : '—'));
    var lastCheck = s ? toInt(s.last_check, 0) : 0;
    if (!lastCheck) { lastCheck = lastFix; }
    kv.push(row('最后检查', lastCheck ? rel(lastCheck) + '（' + clock(lastCheck) + '）' : '—'));
    kv.push(row('tracefs', s && s.tracefs ? esc(s.tracefs) : '—'));
    if (s && (s.mode === 'poll' || String(s.reason || '').indexOf('poll') >= 0)) {
      kv.push(row('轮询间隔', toInt(s.interval, 0) ? toInt(s.interval, 0) + ' 秒' : '—'));
    }
    kv.push(row('最小进程年龄', s && toInt(s.min_age, 0) ? toInt(s.min_age, 0) + ' 秒' : '—'));
    var churn = s ? toInt(s.churn, 0) : 0;
    if (churn > 0) {
      kv.push(row('熔断目标', churn + ' 个（暂停自动修复，等待重试）'));
    }
    /* 沙箱状态在 status.json 的 sandbox_stale/gone/rollback/skip 里；它们只在
       fix 成功分支更新，最近一轮 fix_error_* 时只能标成上次记录。 */
    var sandStale = s ? toInt(s.sandbox_stale, 0) : 0;
    var sandGone = s ? toInt(s.sandbox_gone, 0) : 0;
    var sandRollback = s ? toInt(s.sandbox_rollback, 0) : 0;
    var sandSkip = s ? toInt(s.sandbox_skip, 0) : 0;
    var fixErr = s && String(s.reason || '').indexOf('fix_error_') === 0;
    var sandBits = [];
    if (sandStale) { sandBits.push('僵死（需重启应用）'); }
    if (sandRollback) { sandBits.push('回滚未卸干净（需重启应用）'); }
    if (sandSkip) { sandBits.push('未重建（安全拒绝，需重启应用）'); }
    if (sandGone) { sandBits.push('丢失（会尝试重建）'); }
    if (sandBits.length) {
      kv.push(row('沙箱', (fixErr ? '上次记录：' : '') + sandBits.join('、') +
        (fixErr ? '（最近一轮修复失败）' : '')));
    }
    if (s && isBlindStatus(s)) {
      var blindSince = toInt(s.blind_since, 0);
      kv.push(row('事件通道', '异常' + (blindSince ? ' · 自 ' + rel(blindSince) : '')));
    }
    kv.push(row('版本', s && s.version ? 'v' + esc(s.version) : '—'));
    $('kv').innerHTML = kv.join('');

    $('stamp').textContent = state.fetchedAt ? ('更新于 ' + clock(Math.floor(state.fetchedAt / 1000))) : '—';

    if (s && s.version) { $('ver').textContent = 'v' + s.version; }
    else if (state.snapshot && state.snapshot.version) { $('ver').textContent = 'v' + state.snapshot.version; }

    renderStateBanner();
    renderDiag();
  }

  /* ============================================================
     状态提示：停用/故障/blind/熔断/只读快照/no-root 统一组装成一个 banner
     ============================================================ */
  function configEnabledState() {
    if (state.mode === 'snapshot' && state.snapshot && state.snapshot.config) {
      return toInt(state.snapshot.config.enabled, 1) !== 0;
    }
    if (state.config) { return cfgEnabled(state.config.ENABLED); }
    return null;
  }

  function bannerItemsForState() {
    var s = state.status;
    var items = [];
    if (state.noRoot) {
      items.push({ tone: 'bad', title: '没有 root 权限',
        body: '当前上下文读不到 ' + D + ' 下的状态与配置。请从 Magisk 模块页的「操作」按钮或 KsuWebUI 打开本面板。' });
      if (!s) { return items; }
    }
    if (state.mode === 'snapshot') {
      var age = state.snapshotTs ? (nowSec() - state.snapshotTs) : -1;
      if (isDisabledStatus(s)) {
        items.push({ tone: 'info', title: '守护已停用',
          body: '配置里 ENABLED=0，守护不会修复挂载，这是预期状态。' });
      } else if (!state.alive) {
        items.push({ tone: 'warn', title: '快照很久没更新',
          body: '最近一次状态是 ' + (age >= 0 ? rel(state.snapshotTs) : '未知') + '，守护进程可能没在运行。' +
            '到 Magisk 模块页点「操作」可以看当前状态。' });
      } else {
        items.push({ tone: 'info', title: '只读快照',
          body: '这是守护进程写入的静态状态（' + (age >= 0 ? rel(state.snapshotTs) : '未知') + '）。' +
            '装 KsuWebUI Standalone 后打开本页即可修改配置、执行体检/修复。' });
      }
    } else if (!s) {
      if (state.statusExist === false) {
        items.push({ tone: 'warn', title: '状态文件不存在',
          body: '还没生成 status.json：守护可能没启动过，或被停用。重启手机后会自动生成。' });
      } else if (state.statusSize === 0) {
        items.push({ tone: 'warn', title: '状态文件为空',
          body: 'status.json 是空文件：守护可能刚启动还没写入，稍候会自动刷新。' });
      } else {
        items.push({ tone: 'warn', title: '状态文件读不懂',
          body: 'status.json 不是合法 JSON（可能写到一半），下次守护写状态后会自动恢复。' });
      }
    } else if (isDisabledStatus(s)) {
      items.push({ tone: 'info', title: '守护已停用',
        body: '配置里 ENABLED=0，守护不会修复挂载，这是预期状态。在「配置」里启用并保存即可恢复。' });
    } else if (state.alive === false) {
      items.push({ tone: 'warn', title: '守护进程没在运行',
        body: '下面是上一次写下的状态；点「重启守护」可以重新拉起，或重启手机。' });
    }

    if (s && !isDisabledStatus(s)) {
      if (isBlindStatus(s)) {
        var blindSince = toInt(s.blind_since, 0);
        items.push({ tone: 'bad', title: '事件通道异常',
          body: '收不到挂载事件' + (blindSince ? '（自 ' + rel(blindSince) + '）' : '') +
            '，修复会退化成定时补扫。建议重启手机恢复事件投递。' });
      }
      var churn = toInt(s.churn, 0);
      if (churn > 0) {
        items.push({ tone: 'warn', title: '熔断保护生效',
          body: churn + ' 个目标因频繁被拆已暂停自动修复；重试仍失败会锁定至多 1 小时（重启守护可提前解除）。' });
      }
      var sandStale = toInt(s.sandbox_stale, 0);
      var sandGone = toInt(s.sandbox_gone, 0);
      var sandRollback = toInt(s.sandbox_rollback, 0);
      var sandSkip = toInt(s.sandbox_skip, 0);
      var sandFixErr = String(s.reason || '').indexOf('fix_error_') === 0;
      var staleHead = sandFixErr ? '最近一轮修复失败，下面是上次记录；' : '';
      if (sandStale) {
        items.push({ tone: 'bad', title: '沙箱僵死',
          body: staleHead + '应用里还是旧 FUSE 的僵死挂载，模块不能原地修；重启该应用即可，不必反复点修复。' });
      }
      if (sandRollback) {
        items.push({ tone: 'bad', title: '沙箱回滚未卸干净',
          body: staleHead + '残留挂载没有卸干净，模块不会再把父根叠回去；重启该应用即可收敛。' });
      }
      if (sandSkip) {
        items.push({ tone: 'warn', title: '沙箱未重建（安全拒绝）',
          body: staleHead + '可能是缺少本 boot 同 namespace 的重建证据，或目标被其他挂载层占用；模块不会硬拆，重启该应用后由 SI 重建。' });
      }
      if (sandGone) {
        items.push({ tone: 'warn', title: '沙箱丢失',
          body: staleHead + '模块会尝试重建；若持续出现，说明应用后台被杀或存储服务在反复重挂 FUSE。' });
      }
      var reason = String(s.reason || '');
      if (reason === 'fuse_missing') {
        items.push({ tone: 'warn', title: 'FUSE 层未就绪',
          body: '模块保持 fail-closed，不会乱动挂载；每 60 秒自动重试。' });
      } else if (reason === 'boot_wait') {
        items.push({ tone: 'info', title: '开机等待 FUSE',
          body: '开机宽限期内 FUSE 还没就绪，模块会退避重试，不会动挂载。' });
      }
    }

    /* 配置已停用但守护还在跑（还没重启）：提示一下，别让用户以为没生效 */
    if (state.mode !== 'snapshot' && s && !isDisabledStatus(s) && configEnabledState() === false) {
      items.push({ tone: 'info', title: '配置已停用',
        body: 'config.conf 里 ENABLED=0，保存并重启守护后会停止修复。' });
    }
    if (state.patchConfirm) {
      items.push({ tone: 'warn', title: patchConfirmTitle(state.patchConfirm),
        body: patchConfirmBody(state.patchConfirm) + ' 确认后才会执行，10 秒内有效。',
        actions: [
          { action: 'patch-confirm-go', label: patchConfirmGoLabel(state.patchConfirm) },
          { action: 'patch-confirm-cancel', label: '取消' }
        ] });
    } else if (patchPromptable()) {
      items.push({ tone: 'warn', title: 'Android 17 应用列表或导出可能异常',
        body: '可应用补丁修复（A17 已真机验证）。1.6.0 仅支持 Android 17；A15/A16 待 1.6.1。' +
          '补丁只替换 zygisk-storage-isolation 的 main.dex，确认后才会执行；应用后重启手机生效。' +
          '之后仍可在下方「Android 17 应用列表与导出修复（main.dex）」里手动应用。',
        actions: [
          { action: 'patch-apply', label: '应用补丁' },
          { action: 'patch-dismiss', label: '暂不' }
        ] });
    }
    if (state.mode === 'snapshot' && !BR.ok) {
      items.push({ tone: 'warn', title: '没有可用的 WebUI 桥接',
        body: (BR.note || '桥接没有响应') + '。页面处于只读快照，配置只读。',
        action: 'retry-bridge', actionLabel: '重试连接' });
    }
    return items;
  }

  function renderStateBanner() {
    /* 不在渲染时写提示标记：只有用户点「暂不」或动作成功后才写，
       这样失败/超时不会让下次打开误以为已经提示过。 */
    setBannerItems(bannerItemsForState());
  }

  function metric(label, value, tone) {
    return '<div class="metric' + (tone ? ' ' + tone : '') + '"><div class="label">' + esc(label) +
      '</div><div class="value' + (String(value).length > 7 ? ' small-v' : '') + '">' + esc(value) + '</div></div>';
  }
  function row(k, v) {
    return '<div class="row"><span class="k">' + esc(k) + '</span><span class="v">' + v + '</span></div>';
  }

  var statusLoading = false;
  var lastReprobe = 0;

  function applyPermissionLock(msg) {
    state.noRoot = true;
    state.patchCache = null;
    clearPatchConfirmState();
    state.status = null;
    state.alive = null;
    state.fetchedAt = Date.now();
    state.mode = 'live';
    if (state.patchSdk && !patchSdkOk(state.patchSdk)) {
      state.patch = null;
      state.patchError = '';
    } else {
      state.patchError = '没有 root 权限，无法读取或执行补丁操作。';
    }
    renderPatch();
    renderStatus();
    lockConfig(msg || '没有 root 权限，配置只读。');
    lockActions();
  }

  function refreshStatus() {
    if (!BR.ok) { return Promise.resolve(false); }
    if (statusLoading) { return Promise.resolve(false); }
    statusLoading = true;
    return run(STATUS_CMD).then(function (res) {
      BR.fails = 0;
      var p = parseStatusOutput(res.stdout);
      state.uid = p.uid;
      state.statusExist = p.exist;
      state.statusSize = p.size;
      /* 没有 root 时读不到 /data/adb：明确告诉用户，不要误报"文件为空/守护没运行" */
      if (p.uid !== null && p.uid !== 0) {
        applyPermissionLock('当前不是 root（uid ' + p.uid + '），配置只读。请从 Magisk / KsuWebUI 打开本面板。');
        return false;
      }
      state.noRoot = false;
      state.status = p.obj;
      state.alive = p.alive;
      state.fetchedAt = Date.now();
      state.mode = 'live';
      renderStatus();
      return true;
    }).catch(function (err) {
      /* 连续失败：桥接可能已经失效，回落到快照模式，并在后台重新探测 */
      if (BR.ok) { noteBridgeFailure(); }
      if (BR.ok) {
        state.status = null;
        state.alive = null;
        state.fetchedAt = Date.now();
        renderStatus();
        setBanner('<div class="b-title">状态读取失败</div>' + esc(err.message || err), 'bad');
      }
      return false;
    }).then(function (r) {
      statusLoading = false;
      return r;
    });
  }

  function noteBridgeFailure() {
    BR.fails += 1;
    if (!BR.ok || BR.fails < BRIDGE_FAIL_LIMIT) { return; }
    BR.ok = false;
    BR.note = '桥接连续失败 ' + BR.fails + ' 次，已回落只读快照';
    snapshotMode();
  }

  function maybeReprobe() {
    if (BR.ok || BR.probing) { return; }
    if (!candidates().length) { return; }
    if (Date.now() - lastReprobe < REPROBE_MS) { return; }
    lastReprobe = Date.now();
    probeBridge().then(function (ok) { if (ok) { restoreLive(); } });
  }

  function retryBridge() {
    lastReprobe = Date.now();
    setBannerItems([{ tone: 'info', title: '正在重试连接…', body: '重新探测 WebUI 桥接。' }]);
    probeBridge().then(function (ok) {
      if (ok) { restoreLive().then(function () { toast('已连接桥接'); }); return; }
      setBannerItems([{ tone: 'warn', title: '仍然没有可用的桥接',
        body: (BR.note || '桥接没有响应') + '。可以刷新页面再试。',
        action: 'reload-page', actionLabel: '刷新页面' }]);
    });
  }

  function restoreLive() {
    BR.fails = 0;
    state.noRoot = false;
    unlockAll();
    $('bridgeName').textContent = BR.note;
    setBanner('', 'info');
    return refreshStatus().then(function () {
      return state.noRoot ? false : loadConfig();
    }).then(function () {
      return state.noRoot ? false : loadLog();
    }).then(function () {
      /* 即使没有 root 也先读 SDK：非 Android 17 直接隐藏卡片；37 再显示权限错误。 */
      return loadPatch();
    });
  }

  /* ============================================================
     Android 17 可选补丁（只替换 zygisk-storage-isolation/main.dex）
     si-patch.sh check 输出 KEY=VALUE；这里只负责展示与转发，是否执行由用户点按钮决定。
     文件操作很快：动作结果直接展示，不再补跑第二次 check，也没有 server 重启/等待。
     ============================================================ */
  function parseKv(text) {
    var out = {};
    String(text || '').split('\n').forEach(function (line) {
      var i = line.indexOf('=');
      if (i <= 0) { return; }
      var k = line.slice(0, i).replace(/\s+$/, '');
      if (!/^[A-Z_]+$/.test(k)) { return; }
      out[k] = line.slice(i + 1).replace(/\s+$/, '');
    });
    return out;
  }

  /* SDK 不是 37 直接隐藏整张卡片：先只读 getprop，不请求 si-patch.sh check。
     1.6.0 仅支持 Android 17（A17 资产，已真机验证）；A15/A16 待 1.6.1。 */
  function patchSdkOk(sdk) {
    return sdk === '37';
  }

  function ensurePatchSdk() {
    if (state.patchSdk !== null && state.patchSdk !== undefined) {
      return Promise.resolve(state.patchSdk);
    }
    return run('getprop ro.build.version.sdk').then(function (res) {
      var sdk = String(res.stdout || '').replace(/\s+$/, '').replace(/^\s+/, '');
      if (!sdk) { throw new Error('无法读取 Android SDK'); }
      state.patchSdk = sdk;
      return sdk;
    });
  }

  function hidePatchCard() {
    state.patch = null;
    state.patchError = '';
    state.patchCheckSource = '';
    setPatchTiming('—');
    renderPatch();
    renderStateBanner();
  }

  function clonePatch(p) { return JSON.parse(JSON.stringify(p || {})); }

  /* 首次提示标记与 scripts/si-patch.sh 保持一致：目标文件 + 适用版本，非法字符换成 _。 */
  function patchPromptPath(p) {
    var tag = String((p && p.targetFile) || 'main.dex') + '.' +
      String((p && p.targetVersion) || '');
    tag = tag.replace(/[^A-Za-z0-9._-]/g, '_');
    return D + '/.patch_prompted.' + tag;
  }

  function setPatchTiming(text) {
    var el = $('patchTiming');
    if (el) { el.textContent = text || '—'; }
  }

  function clearPatchResult() {
    var el = $('patchResult');
    if (!el) { return; }
    el.hidden = true;
    el.innerHTML = '';
    el.className = 'result';
  }

  function fillPatchData(kv) {
    var p = kv;
    p.state = String(p.STATE);
    p.sdk = String(p.SDK || '');
    p.si = String(p.SI_VERSION || '');
    p.siCode = String(p.SI_VERSION_CODE || '');
    p.targetModule = String(p.SI_TARGET_MODULE || 'zygisk-storage-isolation');
    p.targetVersion = String(p.SI_TARGET_VERSION || '');
    p.targetVersionCode = String(p.SI_TARGET_VERSION_CODE || '');
    p.targetFile = String(p.SI_TARGET_FILE || 'main.dex');
    p.asset = String(p.ASSET || '');
    p.variant = String(p.VARIANT || '');
    p.match = toInt(p.SI_MATCH, 0) === 1;
    p.dex = String(p.DEX || '');
    p.size = toInt(p.SIZE, 0);
    p.mtime = toInt(p.MTIME, 0);
    p.sha = String(p.SHA || '');
    p.originalSize = toInt(p.ORIGINAL_SIZE, 0);
    p.originalSha = String(p.ORIGINAL_SHA || '');
    p.patchSize = toInt(p.PATCH_SIZE, 0);
    p.patchSha = String(p.PATCH_SHA || '');
    p.backup = toInt(p.BACKUP_COUNT, 0);
    p.backupOk = toInt(p.BACKUP_OK, 0) === 1;
    p.prompted = toInt(p.PROMPTED, 0) === 1;
    p.legacy = toInt(p.LEGACY, 0) === 1;
    p.pendingReboot = toInt(p.PENDING_REBOOT, 0) === 1;
    p.lastAction = '';
    var promptKey = patchPromptPath(p);
    if (state.patchMarkedKey && state.patchMarkedKey !== promptKey) { state.patchMarked = false; }
    state.patch = p;
    state.patchError = '';
  }

  function storePatchCache(p) {
    if (!p) { return; }
    state.patchCache = {
      at: Date.now(), dex: p.dex, size: p.size, mtime: p.mtime, sha: p.sha,
      data: clonePatch(p)
    };
  }

  function patchCacheUsable() {
    return !!(state.patchCache && state.patchCache.data &&
      state.patchCache.data.state !== 'no-target');
  }

  function usePatchCache(source) {
    if (!state.patchCache) { return false; }
    var p = clonePatch(state.patchCache.data);
    state.patch = p;
    state.patchError = '';
    state.patchCheckMs = 0;
    state.patchCheckTimedOut = false;
    state.patchCheckSource = source || 'cache';
    setPatchTiming(source === 'ttl' ? '使用 30 秒内缓存（未跑 check）' : '缓存命中（mtime+size+sha 未变）');
    renderPatch();
    renderStateBanner();
    return true;
  }

  function statPatchTarget(cache) {
    if (!cache || !cache.dex) { return Promise.resolve(null); }
    var q = shq(cache.dex);
    var cmd = 'if [ -f ' + q + ' ]; then stat -c "%s %Y" ' + q +
      ' 2>/dev/null; sha256sum ' + q + ' 2>/dev/null; else echo MISSING; fi';
    return run(cmd, 2500).then(function (res) {
      var text = String(res.stdout || '').trim();
      if (text === 'MISSING') { return { exists: false }; }
      var lines = text.split('\n');
      var m = /^(\d+)\s+(\d+)$/.exec(lines[0] || '');
      var sha = String(lines[1] || '').trim().split(/\s+/)[0] || '';
      if (!m || !sha) { return null; }
      return { exists: true, size: toInt(m[1], 0), mtime: toInt(m[2], 0), sha: sha };
    }).catch(function () { return null; });
  }

  function fetchPatchCheck() {
    if (actionBusy('patchCheck')) { return Promise.resolve(false); }
    beginAction('patchCheck');
    state.patchCheckTimedOut = false;
    state.patchCheckSource = 'checking';
    setPatchTiming('正在检查补丁…');
    renderPatch();
    renderStateBanner();
    return runBg('sh ' + P.patch + ' check', {
      timeoutMs: CHECK_TIMEOUT,
      onProgress: function (ms) {
        setPatchTiming('正在检查… ' + (ms / 1000).toFixed(1) + ' 秒');
      }
    }).then(function (res) {
      state.patchCheckMs = res.elapsed || 0;
      endAction('patchCheck');
      if (res.timedOut && res.rc === null) {
        state.patchCheckTimedOut = true;
        state.patchCache = null;
        state.patchError = '补丁检查超时（8 秒），结果未知';
        setPatchTiming('检查超时（8 秒），结果未知');
        renderPatch();
        renderStateBanner();
        return false;
      }
      if (res.spawnError) {
        state.patchCheckTimedOut = true;
        state.patchCache = null;
        state.patchError = '补丁检查结果未知：' + res.spawnError;
        setPatchTiming('检查未完成，结果未知');
        renderPatch();
        renderStateBanner();
        return false;
      }
      var p = parseKv(res.out);
      if (!p.STATE) {
        state.patchCache = null;
        state.patchError = '补丁检查没有返回 STATE（退出码 ' + res.rc + '）';
        setPatchTiming('检查失败（' + state.patchCheckMs + 'ms）');
        renderPatch();
        renderStateBanner();
        return false;
      }
      fillPatchData(p);
      state.patchCheckSource = 'check';
      state.patchCheckTimedOut = false;
      storePatchCache(state.patch);
      setPatchTiming('检查 ' + state.patchCheckMs + 'ms');
      renderPatch();
      renderStateBanner();
      return true;
    }).catch(function (err) {
      endAction('patchCheck');
      state.patchCheckTimedOut = true;
      state.patchCache = null;
      state.patchError = '补丁检查结果未知：' +
        String(err && err.message ? err.message : err);
      setPatchTiming('检查未完成，结果未知');
      renderPatch();
      renderStateBanner();
      return false;
    });
  }

  function loadPatch(force) {
    clearPatchConfirmState();
    clearPatchResult();
    if (!BR.ok) {
      if (state.patchSdk && !patchSdkOk(state.patchSdk)) { hidePatchCard(); return Promise.resolve(false); }
      state.patchError = '未连接 WebUI 桥接，暂时无法读取补丁状态。';
      renderPatch();
      renderStateBanner();
      return Promise.resolve(false);
    }
    return ensurePatchSdk().then(function (sdk) {
      if (!patchSdkOk(sdk)) { hidePatchCard(); return false; }
      if (state.noRoot) {
        state.patchError = '没有 root 权限，无法读取或执行补丁操作。';
        renderPatch();
        renderStateBanner();
        return false;
      }
      if (!force && patchCacheUsable()) {
        if (Date.now() - state.patchCache.at < PATCH_CACHE_TTL) {
          return usePatchCache('ttl');
        }
        return statPatchTarget(state.patchCache).then(function (st) {
          if (st && st.exists && st.size === state.patchCache.size &&
              st.mtime === state.patchCache.mtime && st.sha === state.patchCache.sha) {
            state.patchCache.at = Date.now();
            return usePatchCache('stat');
          }
          return fetchPatchCheck();
        });
      }
      return fetchPatchCheck();
    }).catch(function (err) {
      state.patchError = '补丁状态读取失败：' + String(err && err.message ? err.message : err);
      renderPatch();
      renderStateBanner();
      return false;
    });
  }

  function patchActionKey(action) {
    if (action === 'apply') { return 'patchApply'; }
    if (action === 'force') { return 'patchForce'; }
    return 'patchRestore';
  }

  function patchBusy() {
    return actionBusy('patchApply') || actionBusy('patchRestore') || actionBusy('patchForce');
  }

  function patchPromptable() {
    var p = state.patch;
    return !!(BR.ok && !state.noRoot && !state.patchError && !state.patchConfirm && p &&
      !patchBusy() && !actionBusy('patchCheck') &&
      patchSdkOk(state.patchSdk) && patchSdkOk(p.sdk) &&
      p.state === 'original' && p.match &&
      !p.prompted && !state.patchDismissed);
  }

  /* 第一次提示后写标记：标记按目标文件+适用版本区分；同一个标记存在时不再重复写。
     本次页面仍保留提示（方便用户点按钮），下次打开由 check 的 PROMPTED 字段判断。 */
  function markPatchPrompted() {
    var p = state.patch;
    if (!p) { return; }
    var path = patchPromptPath(p);
    if (state.patchMarked && state.patchMarkedKey === path) { return; }
    state.patchMarked = true;
    state.patchMarkedKey = path;
    run('umask 077; mkdir -p ' + D + ' && : > ' + path).catch(function () {
      if (state.patchMarkedKey === path) {
        state.patchMarked = false;
        state.patchMarkedKey = '';
      }
    });
  }

  function dismissPatchPrompt() {
    state.patchDismissed = true;
    markPatchPrompted();
    renderStateBanner();
  }

  function clearPatchConfirmTimer() {
    if (state.patchConfirmTimer) {
      clearTimeout(state.patchConfirmTimer);
      state.patchConfirmTimer = null;
    }
  }

  function clearPatchConfirmState() {
    clearPatchConfirmTimer();
    state.patchConfirm = null;
  }

  function cancelPatchConfirm() {
    clearPatchConfirmState();
    renderPatch();
    renderStateBanner();
  }

  function patchConfirmTitle(action) {
    var p = state.patch || {};
    if (action === 'apply') {
      return p.state === 'patched-legacy' ? '确认升级到自建版？' : '确认应用 main.dex 补丁？';
    }
    if (action === 'force') { return '确认强制恢复原版？'; }
    return '确认恢复原版？';
  }

  function patchConfirmGoLabel(action) {
    var p = state.patch || {};
    if (action === 'apply') {
      return p.state === 'patched-legacy' ? '确认升级' : '确认应用';
    }
    if (action === 'force') { return '确认强制恢复'; }
    return '确认恢复原版';
  }

  function patchConfirmBody(action) {
    var p = state.patch || {};
    var mod = p.targetModule || 'zygisk-storage-isolation';
    var file = p.targetFile || 'main.dex';
    var ver = p.targetVersion || '未知版本';
    var what;
    if (action === 'apply') {
      what = p.state === 'patched-legacy'
        ? '把 ' + mod + ' 的社区版 ' + file + ' 升级为自建版（先备份当前社区 dex）'
        : '把 ' + mod + ' 的 ' + file + ' 替换为补丁版';
    } else if (action === 'force') {
      what = '用有效原版备份强制覆盖 ' + mod + ' 的 ' + file;
    } else {
      what = '用有效原版备份恢复 ' + mod + ' 的 ' + file;
    }
    var variantNote = action === 'apply' && p.variant === 'a17'
      ? '本次使用 A17 资产（已真机验证）' : '';
    return '目标模块：' + mod + ' ' + (p.si || '版本未知') + '。将' + what +
      '。仅适用于 ' + ver + '（' + file + '）。' + (variantNote ? variantNote + '。' : '') +
      '重启手机后生效。';
  }

  function armPatchAction(action) {
    if (patchBusy() || actionBusy('patchCheck') || !BR.ok || state.noRoot || state.patchError ||
        state.locked || !patchSdkOk(state.patchSdk) || !state.patch) { return; }
    var p = state.patch;
    var ok = (action === 'apply' && p.match &&
        (p.state === 'original' || p.state === 'patched-legacy')) ||
      (action === 'restore' && p.match && p.backupOk &&
        (p.state === 'patched' || p.state === 'patched-legacy')) ||
      (action === 'force' && p.match && p.backupOk && p.state === 'unknown');
    if (!ok) { return; }
    clearPatchConfirmTimer();
    state.patchConfirm = action;
    state.patchConfirmTimer = setTimeout(function () {
      state.patchConfirmTimer = null;
      if (state.patchConfirm === action) {
        state.patchConfirm = null;
        renderPatch();
        renderStateBanner();
      }
    }, 10000);
    renderPatch();
    renderStateBanner();
  }

  function confirmPatchAction() {
    var action = state.patchConfirm;
    if (!action || patchBusy() || actionBusy('patchCheck')) { return; }
    clearPatchConfirmState();
    runPatchAction(action);
  }

  /* PATCH-PENDING-HINT-START */
  /* 只有“补丁版 + 版本匹配 + 待重启”才显示重启提示；重启后 check 清标记即为空。 */
  function patchPendingHint(p) {
    if (!p || p.state !== 'patched' || !p.match || !p.pendingReboot) { return ''; }
    return p.lastAction === 'applied'
      ? '已应用，重启手机生效（Zygisk 模块在开机时加载）。'
      : '重启手机生效（Zygisk 模块在开机时加载）。';
  }
  /* PATCH-PENDING-HINT-END */

  function renderPatch() {
    var card = $('patchCard');
    if (state.patchSdk && !patchSdkOk(state.patchSdk)) { card.hidden = true; return; }
    var p = state.patch;
    var err = state.patchError;
    if (!p && !err) { card.hidden = true; return; }
    var st = p ? p.state : '';
    if (!err && st !== 'original' && st !== 'patched' && st !== 'patched-legacy' &&
        st !== 'unknown') {
      card.hidden = true;
      return;
    }
    card.hidden = false;

    var applyBtn = $('btnPatchApply');
    var restoreBtn = $('btnPatchRestore');
    var forceBtn = $('btnPatchForce');
    var checkBtn = $('btnPatchCheck');
    var hint = $('patchHint');
    var bits = [];
    var badge = '';
    var mod = p ? (p.targetModule || 'zygisk-storage-isolation') : 'zygisk-storage-isolation';
    var file = p ? (p.targetFile || 'main.dex') : 'main.dex';
    var variantNote = p && p.variant === 'a17' ? 'A17 已真机验证' : '';

    if (err) {
      badge = '读取失败';
      hint.textContent = err;
      hint.hidden = false;
      if (p) {
        bits.push(mod + ' ' + (p.si || '版本未知'));
        bits.push('上次状态：' + (st || '未知'));
      }
    } else if (st === 'original') {
      bits.push(mod + ' ' + (p.si || '版本未知'));
      bits.push(p.size ? (p.size + ' B') : '大小未知');
      bits.push('sha256 ' + (p.sha ? p.sha.slice(0, 12) + '…' : '读取失败'));
      if (p.lastAction === 'restored') {
        badge = '已恢复';
        hint.textContent = '已恢复原版，重启生效（Zygisk 模块在开机时加载）。';
      } else if (p.match) {
        badge = '可应用';
        hint.textContent = 'Android 17 下 SI 应用列表可能为空，或 MediaStore 导出规则不生效，可应用补丁修复。' +
          '1.6.0 仅支持 Android 17；A15/A16 待 1.6.1。补丁只替换 ' + mod + ' 的 ' + file +
          (variantNote ? '（' + variantNote + '）' : '') +
          '，确认后才会执行；应用后重启手机生效。';
      } else {
        badge = '版本不匹配';
        hint.textContent = '当前 ' + mod + ' 版本不在支持范围，未做任何修改。补丁仅适用于 ' +
          (p.targetVersion || '未知版本') + '（' + file + '）。';
      }
      hint.hidden = false;
    } else if (st === 'patched') {
      bits.push(mod + ' ' + (p.si || '版本未知'));
      bits.push(p.match ? '已应用，可恢复原版' : '版本/哈希不在支持范围');
      bits.push(p.backupOk ? '有可用的原版备份' : '没有可用的原版备份');
      if (p.match) {
        badge = '已应用';
        var rebootHint = patchPendingHint(p);
        if (rebootHint) {
          hint.textContent = rebootHint;
          hint.hidden = false;
        } else {
          hint.textContent = '';
          hint.hidden = true;
        }
      } else {
        badge = '版本不匹配';
        hint.textContent = '当前 ' + mod + ' 版本不在支持范围，未做任何修改。' +
          '版本不匹配时不允许恢复或强制恢复。';
        hint.hidden = false;
      }
    } else if (st === 'patched-legacy') {
      bits.push(mod + ' ' + (p.si || '版本未知'));
      bits.push('社区版旧补丁' + (p.size ? ' · ' + p.size + ' B' : ''));
      bits.push(p.backupOk ? '有可用的原版备份' : '缺少原版备份');
      badge = '旧版补丁';
      hint.textContent = '检测到社区版补丁，可升级到本模块自建版，或恢复原版。' +
        (p.backupOk ? '' : ' 缺少原版备份，无法直接恢复。') +
        (p.match ? '' : ' 当前模块版本不匹配，暂不能升级或恢复。');
      hint.hidden = false;
    } else {
      badge = '未知版本';
      bits.push(mod + ' ' + (p.si || '版本未知'));
      bits.push('sha256 ' + (p.sha ? p.sha.slice(0, 12) + '…' : '读取失败'));
      bits.push(p.backupOk ? '有可用的原版备份' : '没有可用的原版备份');
      if (!p.match) {
        hint.textContent = '当前 ' + file + ' 是未知版本，且模块版本不匹配；未做任何修改。' +
          '版本不匹配时不允许强制恢复。';
      } else if (p.backupOk) {
        hint.textContent = '当前 ' + file + ' 是未知版本，未做任何修改。' +
          '检测到有效原版备份，可强制恢复。';
      } else {
        hint.textContent = '当前 ' + file + ' 是未知版本，未做任何修改。' +
          '也没有可用的原版备份。';
      }
      hint.hidden = false;
    }
    if (actionBusy('patchCheck')) {
      badge = '检查中';
      hint.textContent = '正在检查补丁状态，请稍候…';
      hint.hidden = false;
    }
    if (variantNote) { bits.push(variantNote); }
    $('patchBadge').textContent = badge;
    $('patchDetail').textContent = bits.length ? bits.join(' · ') : '—';

    var canAct = !err && BR.ok && !state.noRoot && !state.locked &&
      patchSdkOk(state.patchSdk) && !actionBusy('patchCheck') && !state.patchConfirm;
    applyBtn.textContent = st === 'patched-legacy' ? '升级到自建版' : '应用补丁';
    restoreBtn.textContent = '恢复原版';
    if (err) {
      applyBtn.hidden = true;
      restoreBtn.hidden = true;
      forceBtn.hidden = true;
    } else {
      applyBtn.hidden = !(st === 'original' || st === 'patched-legacy');
      restoreBtn.hidden = !(st === 'patched' || st === 'patched-legacy');
      /* unknown 的强制恢复始终占网格单元；无备份/版本不匹配时置灰而不是消失。 */
      forceBtn.hidden = !(st === 'unknown');
    }
    applyBtn.disabled = !canAct || !p || !p.match || actionBusy('patchApply');
    restoreBtn.disabled = !canAct || !p || !p.match || !p.backupOk || actionBusy('patchRestore');
    forceBtn.disabled = !canAct || !p || !p.match || !p.backupOk || actionBusy('patchForce');
    if (checkBtn) {
      checkBtn.disabled = !BR.ok || state.noRoot || state.locked || state.patchConfirm ||
        actionBusy('patchCheck') || patchBusy();
    }
    $('patchActions').hidden = false;

    var panel = $('patchConfirm');
    if (state.patchConfirm && !patchBusy() && !actionBusy('patchCheck') && !err &&
        patchSdkOk(state.patchSdk)) {
      panel.hidden = false;
      $('patchConfirmTitle').textContent = patchConfirmTitle(state.patchConfirm);
      $('patchConfirmBody').textContent = patchConfirmBody(state.patchConfirm);
      $('btnPatchConfirmGo').textContent = patchConfirmGoLabel(state.patchConfirm);
      $('btnPatchConfirmGo').disabled = false;
    } else {
      panel.hidden = true;
    }
  }

  function showPatchResult(title, body, tone) {
    var el = $('patchResult');
    el.className = 'result ' + (tone || '');
    el.innerHTML = '<div class="r-title">' + esc(title) + '</div>' +
      (body ? '<div class="r-body">' + esc(body) + '</div>' : '');
    el.hidden = false;
  }

  /* PATCH-VERDICT-START */
  /* 补丁动作判定（纯函数，tools/patch.test.sh 用 node 直接跑）：
     1) 退出码已知且非 0 → 失败；known=0 交给调用方再 stat 复核；
     2) “无需重复操作”只算信息；
     3) 超时/无退出码且没有成功标记 → 结果未知，不要直接判失败或成功；
     4) 成功时提示重启，不再跑第二次全量 check。 */
  function patchActionVerdict(action, text, errnoKnown, errno, unknown) {
    var isApply = action === 'apply';
    var t = String(text || '');
    if (t.indexOf('无需重复操作') >= 0) {
      return { tone: 'info', title: '无需重复操作', body: t };
    }
    var unknownBody = (t ? t + '\n' : '') +
      '后台动作可能仍在执行；请点「检查补丁」或刷新确认当前状态。';
    if (unknown) {
      return { tone: 'warn', title: '结果未知，请刷新检查', body: unknownBody };
    }
    if (errnoKnown === true && errno !== 0) {
      return { tone: 'bad', title: isApply ? '补丁应用失败' : '恢复失败',
        body: t || '命令没有返回可识别结果。' };
    }
    if (errnoKnown !== true) {
      var marker = isApply ? '已应用补丁' : '已恢复原版';
      var legacyMarker = '已从社区版升级到自建补丁';
      if (t.indexOf(marker) < 0 && !(isApply && t.indexOf(legacyMarker) >= 0)) {
        return { tone: 'warn', title: '结果未知，请刷新检查', body: unknownBody };
      }
    }
    var restart = '重启生效（Zygisk 模块在开机时加载）。';
    var body = t;
    if (t.indexOf('重启生效') < 0) { body = (t ? t + '\n' : '') + restart; }
    return {
      tone: 'good',
      title: isApply ? '已应用，重启手机生效' : '已恢复原版，重启手机生效',
      body: body
    };
  }
  /* PATCH-VERDICT-END */

  /* 动作后只复核一次：一条命令同时读 stat(size/mtime) 与 sha256，不再跑全量 check。 */
  function verifyPatchTarget(action) {
    var p = state.patch;
    if (!p || !p.dex) { return Promise.resolve(false); }
    var started = Date.now();
    var cmd = 'if [ -f ' + shq(p.dex) + ' ]; then stat -c "%s %Y" ' + shq(p.dex) +
      ' 2>/dev/null; sha256sum ' + shq(p.dex) + ' 2>/dev/null; else echo MISSING; fi';
    return run(cmd, 3000).then(function (res) {
      var lines = String(res.stdout || '').trim().split('\n');
      if (lines[0] === 'MISSING') {
        p.state = 'no-target';
        p.size = 0;
        p.mtime = 0;
        p.sha = '';
        return true;
      }
      var m = /^(\d+)\s+(\d+)$/.exec(lines[0] || '');
      var sha = String(lines[1] || '').trim().split(/\s+/)[0] || '';
      if (!m || !sha) { return false; }
      p.size = toInt(m[1], 0);
      p.mtime = toInt(m[2], 0);
      p.sha = sha;
      if (sha === p.patchSha && p.size === p.patchSize) {
        p.state = 'patched';
      } else if (sha === p.originalSha && p.size === p.originalSize) {
        p.state = 'original';
      } else {
        p.state = 'unknown';
      }
      state.patchCheckMs = Date.now() - started;
      setPatchTiming('动作复核 ' + state.patchCheckMs + 'ms');
      return true;
    }).catch(function () { return false; });
  }

  /* 复核成功后更新卡片状态并写缓存，避免动作后紧接着又跑 check。 */
  function applyPatchState(action, fromLegacy) {
    var p = state.patch;
    if (!p) { return; }
    p.lastAction = action === 'apply' ? 'applied' : 'restored';
    p.pendingReboot = action === 'apply';
    if (action === 'apply') {
      /* 原版升级会新建原版备份；社区旧版升级只新建 legacy 备份，原版备份状态不变。 */
      p.legacy = false;
      p.LEGACY = 0;
      if (!fromLegacy) { p.backupOk = 1; }
      p.backup = toInt(p.backup, 0) + 1;
    } else {
      p.legacy = false;
      p.LEGACY = 0;
    }
    storePatchCache(p);
  }

  function runPatchAction(action) {
    if (patchBusy()) {
      showPatchResult('请稍候', '另一个补丁操作正在进行，完成后再试。', 'warn');
      return;
    }
    if (actionBusy('patchCheck')) {
      showPatchResult('请稍候', '正在检查补丁状态，完成后再执行动作。', 'warn');
      return;
    }
    if (!BR.ok || !state.patch || !patchSdkOk(state.patchSdk)) {
      showPatchResult('无法执行', '未连接 WebUI 桥接，补丁操作需要 root 权限。', 'bad');
      return;
    }
    var isApply = action === 'apply';
    var isForce = action === 'force';
    var cmd = isForce ? 'restore --force' : action;
    var key = patchActionKey(action);
    var started = Date.now();
    var actionOk = false;
    var fromLegacy = state.patch.state === 'patched-legacy';
    state.patch.lastAction = '';
    clearPatchConfirmState();
    beginAction(key);
    renderPatch();
    var progressTitle = isApply
      ? (fromLegacy ? '正在升级到自建版…' : '正在应用补丁…')
      : '正在恢复原版…';
    showPatchResult(progressTitle, '后台执行中，页面可以继续操作', '');
    runBg('sh ' + P.patch + ' ' + cmd, {
      timeoutMs: PATCH_ACTION_TIMEOUT,
      onProgress: function (ms) {
        showPatchResult(progressTitle,
          '后台执行中 · 已运行 ' + (ms / 1000).toFixed(1) + ' 秒', '');
      }
    }).then(function (res) {
      var elapsed = res.elapsed || (Date.now() - started);
      if (res.timedOut && res.rc === null) {
        var tu = patchActionVerdict(action, '', false, null, true);
        showPatchResult(tu.title, tu.body, tu.tone);
        return;
      }
      if (res.spawnError) {
        var su = patchActionVerdict(action, '启动失败：' + res.spawnError, false, null, true);
        showPatchResult(su.title, su.body, su.tone);
        return;
      }
      var text = String(res.out || '');
      var v = patchActionVerdict(action, text, res.rc !== null, res.rc, false);
      if (v.tone !== 'good') {
        if (v.tone === 'info') { actionOk = true; }
        showPatchResult(v.title, v.body, v.tone);
        return;
      }
      return verifyPatchTarget(action).then(function (ok) {
        if (!ok) {
          showPatchResult('结果未知，请刷新检查',
            (text ? text + '\n' : '') +
            '动作命令已返回，但读取 main.dex 新状态失败；请点「检查补丁」确认。', 'warn');
          return;
        }
        var expected = isApply ? 'patched' : 'original';
        if (state.patch.state !== expected) {
          storePatchCache(state.patch);
          showPatchResult(isApply ? '补丁应用失败' : '恢复失败',
            (text ? text + '\n' : '') + '复核发现 main.dex 当前为 ' +
            state.patch.state + '，不是预期的 ' + expected + '。', 'bad');
          return;
        }
        applyPatchState(action, fromLegacy);
        actionOk = true;
        var body = text;
        if (body.indexOf('重启生效') < 0) {
          body = (body ? body + '\n' : '') + '重启生效（Zygisk 模块在开机时加载）。';
        }
        body = (body ? body + '\n' : '') + '复核：main.dex=' + state.patch.state +
          '，' + state.patch.size + ' B · ' + elapsed + 'ms';
        var okTitle = (isApply && fromLegacy)
          ? '已升级到自建版，重启手机生效' : v.title;
        showPatchResult(okTitle, body, v.tone);
      });
    }).catch(function (err) {
      /* 动作可能已经执行：异常时按“结果未知”处理，不要直接判失败或成功。 */
      var eu = patchActionVerdict(action, '补丁操作异常：' +
        String(err && err.message ? err.message : err), false, null, true);
      showPatchResult(eu.title, eu.body, eu.tone);
    }).then(function () {
      endAction(key);
      if (actionOk && state.patch) {
        /* 只有动作成功/无需重复才算已提示；失败/超时不能把旧状态写进缓存。 */
        state.patch.prompted = true;
        storePatchCache(state.patch);
        markPatchPrompted();
      } else {
        /* 失败/超时后下一次刷新或重开面板必须重新 check。 */
        state.patchCache = null;
      }
      renderPatch();
      renderStateBanner();
    });
  }

  /* ============================================================
     只读快照（无桥接）
     ============================================================ */
  function snapshotMode() {
    var snap = window.__SI_SNAPSHOT__;
    state.mode = 'snapshot';
    clearPatchConfirmState();
    if (state.patch) {
      state.patchError = '未连接 WebUI 桥接，补丁操作不可用；以下是上次读取的状态。';
    } else {
      state.patchError = '';
    }
    renderPatch();
    if (!snap || !snap.status) {
      state.snapshot = null; state.snapshotTs = 0;
      state.status = null; state.alive = null; state.fetchedAt = 0;
      state.config = null; state.configRaw = null;
      $('statePill').textContent = '未连接';
      $('statePill').className = 'pill';
      $('bridgeName').textContent = '无 WebUI 桥接';
      $('metrics').innerHTML = metric('运行时长', '—', '') + metric('守护进程', '—', '') +
        metric('本次修复', '—', '') + metric('累计修复', '—', '') +
        metric('隔离进程', '—', '') + metric('最后事件', '—', '');
      $('kv').innerHTML = row('提示', '请从模块「操作」按钮或 KsuWebUI 打开本页');
      setBannerItems([{ tone: 'warn', title: '只读模式',
        body: '这里没有可用的 WebUI 桥接，也还没生成状态快照。Magisk 里点模块的「操作」按钮可以直接看到守护状态；装了 KsuWebUI 后可在其中打开本面板。',
        action: 'retry-bridge', actionLabel: '重试连接' }]);
      lockConfig('未连接桥接，配置只读。');
      lockActions();
      renderDiag();
      return;
    }
    state.snapshot = snap;
    state.snapshotTs = toInt(snap.ts, 0);
    state.status = snap.status || null;
    var age = state.snapshotTs ? (nowSec() - state.snapshotTs) : -1;
    /* 快照超过 10 分钟没更新，基本可以判定守护没在跑 */
    state.alive = age >= 0 && age <= SNAPSHOT_STALE;
    state.fetchedAt = state.snapshotTs * 1000;
    $('bridgeName').textContent = '只读快照';
    renderStatus();
    lockConfig('只读快照：修改配置需要 WebUI 桥接。');
    showReadOnlyConfig(snap.config);
    lockActions();
    if (snap.log && snap.log.length) { renderLog(snap.log, true); }
    else { $('logBox').textContent = '（快照里没有日志）'; }
  }

  /* 快照里的配置是只读展示（契约：snapshot.config = {enabled,mode,interval,min_age}） */
  function showReadOnlyConfig(cfg) {
    if (!cfg || typeof cfg !== 'object') {
      $('cfgHint').textContent = '只读快照里没有配置信息（守护版本可能较旧），配置只读。';
      $('cfgHint').hidden = false;
      return;
    }
    var enabled = toInt(cfg.enabled, 1) !== 0;
    var mode = (cfg.mode === 'event' || cfg.mode === 'poll') ? cfg.mode : 'auto';
    var iv = Math.min(600, Math.max(10, toInt(cfg.interval, 60)));
    var ma = Math.min(120, Math.max(5, toInt(cfg.min_age, 15)));
    form.enabled = enabled;
    form.mode = mode;
    form.interval = iv;
    form.minAge = ma;
    form.snap = null;
    $('cfgEnabled').checked = enabled;
    var segs = $('cfgMode').getElementsByTagName('button');
    for (var i = 0; i < segs.length; i++) {
      segs[i].setAttribute('aria-pressed', segs[i].getAttribute('data-mode') === mode ? 'true' : 'false');
    }
    $('cfgInterval').value = String(iv);
    $('cfgMinAge').value = String(ma);
    syncModeFields();
    $('cfgActions').hidden = true;
  }

  function lockConfig(msg) {
    $('cfgHint').textContent = msg;
    $('cfgHint').hidden = false;
    $('cfgEnabled').disabled = true;
    var segs = $('cfgMode').getElementsByTagName('button');
    for (var i = 0; i < segs.length; i++) { segs[i].disabled = true; }
    $('cfgInterval').disabled = true;
    $('cfgMinAge').disabled = true;
    var btns = document.querySelectorAll('.stepper button');
    for (var j = 0; j < btns.length; j++) { btns[j].disabled = true; }
    $('cfgSave').disabled = true;
    $('cfgDiscard').disabled = true;
    $('cfgActions').hidden = true;
  }
  function actionBusy(key) { return !!state.actionBusy[key]; }

  function anyActionBusy() {
    for (var k in state.actionBusy) {
      if (state.actionBusy[k]) { return true; }
    }
    return false;
  }

  /* 只禁被点的按钮：刷新/体检/修复/重启各管各的，长动作在后台跑时界面仍可操作。 */
  function syncTopButtons() {
    var map = { refresh: 'btnRefresh', check: 'btnCheck', fix: 'btnFix', restart: 'btnRestart' };
    for (var key in map) {
      var el = $(map[key]);
      if (el) { el.disabled = state.locked || actionBusy(key); }
    }
    state.busy = anyActionBusy();
  }

  function beginAction(key) {
    state.actionBusy[key] = true;
    syncTopButtons();
  }

  function endAction(key) {
    state.actionBusy[key] = false;
    syncTopButtons();
  }

  function unlockAll() {
    state.locked = false;
    ['btnApps', 'btnLog'].forEach(function (id) {
      var el = $(id);
      if (!el) { return; }
      el.disabled = false;
      el.removeAttribute('data-busy');
    });
    syncTopButtons();
    $('cfgHint').hidden = true;
  }

  function lockActions() {
    state.locked = true;
    ['btnApps', 'btnLog'].forEach(function (id) {
      var el = $(id); if (el) { el.disabled = true; }
    });
    syncTopButtons();
  }

  /* ============================================================
     配置
     ============================================================ */
  var form = { enabled: false, mode: 'auto', interval: 60, minAge: 15, snap: null };

  function parseConfig(raw) {
    var cfg = {};
    String(raw || '').split('\n').forEach(function (line) {
      var m = /^\s*([A-Z_]+)\s*=\s*(.*?)\s*$/.exec(line);
      if (!m) { return; }
      cfg[m[1]] = m[2].replace(/\s+#.*$/, '').replace(/\r/g, '');
    });
    return cfg;
  }

  function cfgEnabled(v) {
    /* 与守护 / supervisor / action.sh 一致：空值或无法识别的写法都按启用，
       只有显式 0/false/no/off 才算停用。 */
    var t = String(v == null ? '' : v).trim().toLowerCase();
    if (!t) { return true; }
    return !(t === '0' || t === 'false' || t === 'no' || t === 'off');
  }

  function applyConfig(cfg) {
    form.enabled = cfgEnabled(cfg.ENABLED);
    form.mode = (cfg.MODE === 'event' || cfg.MODE === 'poll') ? cfg.MODE : 'auto';
    form.interval = Math.min(600, Math.max(10, toInt(cfg.POLL_INTERVAL, 60)));
    form.minAge = Math.min(120, Math.max(5, toInt(cfg.MIN_AGE, 15)));
    form.snap = {
      enabled: form.enabled, mode: form.mode, interval: form.interval, minAge: form.minAge
    };

    $('cfgEnabled').checked = form.enabled;
    $('cfgEnabled').disabled = false;
    var segs = $('cfgMode').getElementsByTagName('button');
    for (var i = 0; i < segs.length; i++) {
      segs[i].disabled = false;
      segs[i].setAttribute('aria-pressed', segs[i].getAttribute('data-mode') === form.mode ? 'true' : 'false');
    }
    $('cfgInterval').value = String(form.interval);
    $('cfgMinAge').value = String(form.minAge);
    $('cfgInterval').disabled = false;
    $('cfgMinAge').disabled = false;
    syncModeFields();
    var btns = document.querySelectorAll('.stepper button');
    for (var j = 0; j < btns.length; j++) { btns[j].disabled = false; }
    $('cfgSave').disabled = false;
