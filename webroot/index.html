    $('cfgDiscard').disabled = false;
    $('cfgHint').hidden = true;
    refreshDirty();
  }

  function syncModeFields() {
    var m = null;
    var segs = $('cfgMode').getElementsByTagName('button');
    for (var i = 0; i < segs.length; i++) {
      if (segs[i].getAttribute('aria-pressed') === 'true') { m = segs[i].getAttribute('data-mode'); break; }
    }
    $('cfgPollGroup').hidden = (m !== 'poll');
  }

  function readForm() {
    var iv = parseInt($('cfgInterval').value, 10);
    var ma = parseInt($('cfgMinAge').value, 10);
    return {
      enabled: $('cfgEnabled').checked,
      mode: (function () {
        var segs = $('cfgMode').getElementsByTagName('button');
        for (var i = 0; i < segs.length; i++) {
          if (segs[i].getAttribute('aria-pressed') === 'true') { return segs[i].getAttribute('data-mode'); }
        }
        return 'auto';
      })(),
      /* 清空就是 null：不静默回填，校验时统一报错 */
      interval: isFinite(iv) ? iv : null,
      minAge: isFinite(ma) ? ma : null
    };
  }

  function validate(f) {
    var ok = true;
    var ivVisible = !$('cfgPollGroup').hidden;
    var ivBad = ivVisible && (f.interval === null || f.interval < 10 || f.interval > 600);
    var maBad = f.minAge === null || f.minAge < 5 || f.minAge > 120;
    $('cfgInterval').classList.toggle('bad', ivBad);
    $('cfgMinAge').classList.toggle('bad', maBad);
    $('cfgIntervalErr').hidden = !ivBad;
    $('cfgMinAgeErr').hidden = !maBad;
    if (ivBad || maBad) { ok = false; }
    return ok;
  }

  function refreshDirty() {
    if (!form.snap) { $('cfgActions').hidden = true; return false; }
    var f = readForm();
    var dirty = (f.enabled ? 1 : 0) !== (form.snap.enabled ? 1 : 0) ||
      f.mode !== form.snap.mode ||
      (f.interval === null ? '' : String(f.interval)) !== String(form.snap.interval) ||
      (f.minAge === null ? '' : String(f.minAge)) !== String(form.snap.minAge);
    $('cfgActions').hidden = !dirty;
    if (dirty) {
      $('cfgSave').disabled = false;
      $('cfgDiscard').disabled = false;
      validate(f);
    }
    return dirty;
  }

  /* 配置保存：保留注释与未知键，只替换 4 个已知键；内容走 base64，避免引号/换行注入。 */
  var CFG_KEYS = ['ENABLED', 'MODE', 'POLL_INTERVAL', 'MIN_AGE'];

  function buildConfigText(raw, values) {
    var lines = String(raw == null ? '' : raw).replace(/\r\n/g, '\n').split('\n');
    if (lines.length && lines[lines.length - 1] === '') { lines.pop(); }
    var seen = {};
    var out = lines.map(function (line) {
      /* 只替换值区间：行尾注释（`# ...`）原样保留，符合“保留未知行/注释”的约定 */
      var hash = line.indexOf('#');
      var body = hash >= 0 ? line.slice(0, hash) : line;
      var comment = hash >= 0 ? line.slice(hash) : '';
      var m = /^(\s*)([A-Z_]+)(\s*)=/.exec(body);
      if (!m || !Object.prototype.hasOwnProperty.call(values, m[2])) { return line; }
      seen[m[2]] = 1;
      return m[1] + m[2] + m[3] + '=' + values[m[2]] + (comment ? ' ' + comment : '');
    });
    for (var i = 0; i < CFG_KEYS.length; i++) {
      var k = CFG_KEYS[i];
      if (!seen[k]) { out.push(k + '=' + values[k]); }
    }
    return out.join('\n') + '\n';
  }

  function b64utf8(str) {
    var s = String(str);
    try {
      if (typeof window.TextEncoder === 'function' && typeof window.btoa === 'function') {
        var bytes = new window.TextEncoder().encode(s);
        var bin = '';
        for (var i = 0; i < bytes.length; i++) { bin += String.fromCharCode(bytes[i]); }
        return window.btoa(bin);
      }
    } catch (e) { /* 回退到下面 */ }
    return window.btoa(unescape(encodeURIComponent(s)));
  }

  function loadConfig() {
    if (!BR.ok) { return Promise.resolve(false); }
    if (state.noRoot) { lockConfig('没有 root 权限，配置只读。'); return Promise.resolve(false); }
    return run('cat ' + P.config).then(function (res) {
      var raw = String(res.stdout || '');
      var cfg = parseConfig(raw);
      if (!cfg.ENABLED && !cfg.MODE && !cfg.POLL_INTERVAL && !cfg.MIN_AGE) {
        throw new Error('config.conf 里没有可识别的配置项（文件为空或格式不对）');
      }
      state.config = cfg;
      state.configRaw = raw;
      applyConfig(cfg);
      return true;
    }).catch(function (err) {
      /* 读失败就整块锁住：别让用户在空表单上改出半套配置 */
      lockConfig('读取配置失败：' + (err.message || err) + '（配置已锁定，点「刷新」重试）');
      return false;
    });
  }

  function saveConfig() {
    var f = readForm();
    if (!validate(f)) { toast('配置数值不合法'); return; }
    if (!form.snap) { toast('配置尚未读取成功'); return; }
    if (actionBusy('config')) { return; }

    /* 轮询间隔在非轮询模式下不显示：一律沿用上一次有效值（隐藏的输入框可能残留旧值）；
       MIN_AGE 始终可见，必须显式填写。 */
    var iv = ($('cfgPollGroup').hidden || f.interval === null) ? form.snap.interval : f.interval;
    var ma = f.minAge;
    var mode = (f.mode === 'event' || f.mode === 'poll') ? f.mode : 'auto';
    var values = {
      ENABLED: f.enabled ? '1' : '0',
      MODE: mode,
      POLL_INTERVAL: String(iv),
      MIN_AGE: String(ma)
    };
    var text = buildConfigText(state.configRaw, values);
    var tmp = P.config + '.tmp.$$';
    var cmd = 'umask 077; printf %s \'' + b64utf8(text) + '\' | base64 -d > ' + tmp +
      ' && chmod 600 ' + tmp + ' && mv -f ' + tmp + ' ' + P.config;

    beginAction('config');
    $('cfgSave').disabled = true;
    var written = false;

    function markSaved() {
      form.snap = { enabled: f.enabled, mode: mode, interval: iv, minAge: ma };
      /* 隐藏中的轮询间隔不会显示，但输入框里可能残留旧数字；保存后同步成真正写入的值 */
      if ($('cfgInterval')) { $('cfgInterval').value = String(iv); }
      $('cfgActions').hidden = true;
    }

    runBg(cmd, { timeoutMs: 5000 }).then(function (w) {
      if (w.timedOut && w.rc === null) {
        throw { unknownWrite: true, message: '配置写入超时（超过 5 秒），结果未知' };
      }
      if (w.spawnError) { throw new Error('配置写入未启动：' + w.spawnError); }
      if (w.rc !== 0) {
        throw new Error('配置写入失败（退出码 ' + w.rc + '）：' + String(w.out || '').slice(-300));
      }
      written = true;
      state.config = values;
      state.configRaw = text;
      return runBg('sh ' + P.restart, { timeoutMs: RESTART_TIMEOUT });
    }).then(function (r) {
      if (r.timedOut && r.rc === null) {
        markSaved();
        opResult('配置已保存，重启结果未知',
          '重启后台命令超过 10 秒未返回；请点「刷新」确认守护状态。', 'warn');
        return;
      }
      if (r.spawnError) {
        markSaved();
        opResult('配置已保存，重启结果未知',
          '重启命令未正常启动：' + r.spawnError, 'warn');
        return;
      }
      if (r.rc !== 0) {
        markSaved();
        opResult('配置已写入，但重启守护失败',
          '退出码 ' + r.rc + '；守护可能还在用旧配置，点「重启守护」重试。', 'warn');
        return;
      }
      markSaved();
      toast('已保存，守护进程重启中');
      setTimeout(function () { refreshStatus(); }, 1500);
      setTimeout(function () { refreshStatus(); }, 4000);
    }).catch(function (err) {
      if (written) {
        /* 文件已经落盘，只是重启失败：界面同步到新值，别让用户以为没保存 */
        markSaved();
        opResult('配置已写入，但重启守护失败',
          '守护进程可能还在用旧配置，点「重启守护」重试。', 'warn');
      } else if (err && err.unknownWrite) {
        toast('配置保存结果未知，请刷新确认');
      } else {
        toast('保存失败：' + (err && err.message ? err.message : err));
      }
    }).then(function () {
      endAction('config');
      if (!state.locked) {
        $('cfgSave').disabled = false;
        refreshDirty();
      }
    });
  }

  /* ============================================================
     操作
     ============================================================ */
  function opResult(title, body, tone) {
    var el = $('opResult');
    el.className = 'result ' + (tone || '');
    el.innerHTML = '<div class="r-title">' + esc(title) + '</div><div class="r-body">' + esc(body) + '</div>';
    el.hidden = false;
    $('opStamp').textContent = clock(nowSec());
  }

  function parseResultLine(text) {
    var m = /RESULT\b([^\n]*)/.exec(String(text || ''));
    if (!m) { return null; }
    var out = {};
    var re = /([a-z_]+)=([A-Za-z0-9_+.-]+)/g;
    var kv;
    while ((kv = re.exec(m[1])) !== null) { out[kv[1]] = kv[2]; }
    return out;
  }

  function runFix(dry) {
    var key = dry ? 'check' : 'fix';
    if (actionBusy(key)) { return; }
    var started = Date.now();
    beginAction(key);
    opResult(dry ? '正在体检…' : '正在修复…', '后台执行中，页面可以继续操作', '');
    /* 不传 SI_MIN_AGE：fix 自己从 config.conf 读 MIN_AGE，面板显示的也是同一个值 */
    var cmd = 'sh ' + P.fix + (dry ? ' -n' : ' -q');
    return runBg(cmd, {
      timeoutMs: FIX_TIMEOUT,
      onProgress: function (ms) {
        opResult(dry ? '正在体检…' : '正在修复…',
          '后台执行中 · 已运行 ' + (ms / 1000).toFixed(1) + ' 秒', '');
      }
    }).then(function (res) {
      var ms = res.elapsed || (Date.now() - started);
      if (res.timedOut && res.rc === null) {
        opResult('结果未知，请刷新检查',
          '后台命令超过 30 秒未返回；可能仍在执行，请稍后点「刷新」看状态。', 'warn');
        return;
      }
      if (res.spawnError) {
        opResult('结果未知，请刷新检查',
          '命令未正常启动或桥接无响应：' + res.spawnError, 'warn');
        return;
      }
      var text = String(res.out || '');
      var r = parseResultLine(text);
      if (!r) {
        opResult('没有拿到结果行',
          (text.slice(-400) || '（无输出）') + ' · 退出码 ' + res.rc + ' · 耗时 ' + ms + 'ms', 'warn');
        return;
      }
      if (r.error) {
        opResult('执行失败：' + errorText(r.error),
          '检查 ' + toInt(r.checked, 0) + ' 个进程 · 耗时 ' + ms + 'ms', 'bad');
        return;
      }
      if (r.defer === 'fuse') {
        opResult('FUSE 层未就绪', '本轮没有动任何挂载；守护会在开机宽限期内退避重试。', 'warn');
        return;
      }
      if (r.skipped && String(r.skipped).split('+').indexOf('locked') >= 0) {
        opResult('另一轮修复正在进行', '这一轮没有执行（抢锁失败），几秒后重试即可。', 'warn');
        return;
      }
      var fixed = toInt(r.fixed, 0);
      var broken = toInt(r.broken, 0);
      var checked = toInt(r.checked, 0);
      var young = toInt(r.young, 0);
      var churn = toInt(r.churn, 0);
      var retry = toInt(r.retry, 0);
      var sandbox = toInt(r.sandbox, 0);
      /* broken 是"需要修复的进程数"，fixed 是"补上的挂载条数"，单位不能混 */
      var title = dry
        ? (broken > 0 ? ('发现 ' + broken + ' 个进程需要修复') : '一切正常')
        : (fixed > 0 ? ('已修复 ' + fixed + ' 条挂载')
          : (broken > 0 ? ('发现 ' + broken + ' 个进程需要修复，但本轮未补上') : '没有需要修复的挂载'));
      var body = '检查 ' + checked + ' 个已隔离进程' +
        (broken ? ' · 需修复 ' + broken + ' 个进程' : '') +
        (young ? ' · ' + young + ' 个进程太年轻，已跳过' : '') +
        (sandbox ? ' · 重建沙箱 ' + sandbox + ' 个' : '') +
        (r.skipped ? ' · 跳过：' + skipText(r.skipped) : '') +
        (churn ? ' · 熔断跳过 ' + churn + ' 个目标' : '') +
        (retry ? ' · 约 ' + retry + ' 秒后重试' : '') +
        ' · 耗时 ' + ms + 'ms';
      if (res.rc !== 0) { body += ' · 退出码 ' + res.rc; }
      var tone = '';
      if (dry) { tone = broken > 0 ? 'warn' : ''; }
      else if (fixed > 0) { tone = 'good'; }
      else if (broken > 0) { tone = 'warn'; }
      if (res.rc !== 0 && tone !== 'warn' && tone !== 'bad') { tone = 'warn'; }
      opResult(title, body, tone);
      if (!dry && (fixed > 0 || churn > 0)) { setTimeout(refreshStatus, 800); }
    }).catch(function (err) {
      opResult('执行失败', err && err.message ? err.message : String(err), 'bad');
    }).then(function () { endAction(key); });
  }

  function waitDaemonAlive(ms) {
    var deadline = Date.now() + ms;
    function once() {
      return refreshStatus().then(function () {
        if (state.alive === true) { return true; }
        if (Date.now() >= deadline) { return false; }
        return new Promise(function (r) { setTimeout(r, 500); }).then(once);
      });
    }
    return once();
  }

  function restartDaemon() {
    if (actionBusy('restart')) { return; }
    beginAction('restart');
    opResult('正在重启守护…', '后台执行中，页面可以继续操作', '');
    return runBg('sh ' + P.restart, { timeoutMs: RESTART_TIMEOUT }).then(function (res) {
      if (res.timedOut && res.rc === null) {
        opResult('结果未知，请刷新检查',
          '重启命令超过 10 秒未返回；后台可能仍在执行，请点「刷新」确认。', 'warn');
        return;
      }
      if (res.spawnError) {
        opResult('结果未知，请刷新检查',
          '重启命令未正常启动：' + res.spawnError, 'warn');
        return;
      }
      if (res.rc !== 0) {
        opResult('重启失败',
          '退出码 ' + res.rc + '：' + String(res.out || '').slice(-300), 'bad');
        return;
      }
      opResult('正在确认守护…', '重启命令已返回，等待新进程上报状态', '');
      return waitDaemonAlive(4000).then(function (ok) {
        opResult(ok ? '守护已重启' : '重启中',
          ok ? '新进程已在运行' : '再等几秒点「刷新」确认', ok ? 'good' : 'warn');
      });
    }).catch(function (err) {
      opResult('重启失败', err && err.message ? err.message : String(err), 'bad');
    }).then(function () { endAction('restart'); });
  }

  /* ============================================================
     应用目录
     ============================================================ */
  function appState(a) {
    if (a === 1) { return { cls: 'done', text: '正常' }; }
    if (a === 0) { return { cls: 'miss', text: '缺失' }; }
    if (a === -2) { return { cls: 'off', text: '不适用' }; }
    if (a === -1) { return { cls: 'off', text: '未运行' }; }
    return { cls: 'off', text: '—' };
  }

  function renderApps(data) {
    state.apps = data;
    var sum = '共 ' + toInt(data.total, 0) + ' 个 · 运行中 ' + toInt(data.running, 0) +
      ' · 有缺失 ' + toInt(data.missing, 0);
    $('appsSum').textContent = sum;

    var rows = [];
    (Array.isArray(data.apps) ? data.apps : []).forEach(function (a) {
      if (!a || typeof a !== 'object') { return; }
      var st = appState(a.a);
      var dirs = Array.isArray(a.d) ? a.d : [];
      var chips = dirs.map(function (d) {
        if (!Array.isArray(d)) { return ''; }
        var ok = d[1] === 1;
        return '<span class="chip ' + (ok ? 'ok' : (d[1] === 0 ? 'bad' : 'na')) + '">' + esc(d[0]) + '</span>';
      }).join('');
      rows.push('<tr><td class="app">' + esc(a.p) + '<div style="margin-top:4px">' + (chips || '<span class="chip na">无目录</span>') +
        '</div></td><td class="st ' + st.cls + '">' + st.text + '</td></tr>');
    });

    if (!rows.length) {
      $('appsBody').innerHTML = '<div class="empty">没有读到应用记录（SI 未启用或被隔离的应用为空）</div>';
      return;
    }
    $('appsBody').innerHTML = '<table class="tbl"><thead><tr><th>应用 / 允许的目录</th><th class="st">挂载</th></tr></thead><tbody>' +
      rows.join('') + '</tbody></table>';
  }

  function loadApps() {
    var btn = $('btnApps');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>';
    $('appsSum').textContent = '读取中…';
    return run('sh ' + P.list).then(function (res) {
      var raw = String(res.stdout || '').trim();
      if (!raw) { throw new Error('没有输出（list-apps 可能不是 root 运行或脚本报错）'); }
      var data = null;
      try { data = JSON.parse(raw); }
      catch (e) {
        throw new Error('list-apps 返回的不是合法 JSON（输出可能被截断或脚本报错），已放弃解析');
      }
      if (!data || typeof data !== 'object' || !Array.isArray(data.apps)) {
        throw new Error('list-apps 返回的数据结构不完整（缺少 apps 数组）');
      }
      if (data.error) {
        throw new Error('配置解析失败：' + errorText(data.error));
      }
      renderApps(data);
    }).catch(function (err) {
      $('appsSum').textContent = '读取失败：' + (err && err.message ? err.message : String(err));
      $('appsBody').innerHTML = '';
    }).then(function () {
      btn.disabled = false;
      btn.textContent = '重新读取';
    });
  }

  /* ============================================================
     日志
     ============================================================ */
  function renderLog(lines, fromSnapshot) {
    var box = $('logBox');
    var arr = Array.isArray(lines) ? lines : String(lines || '').split('\n');
    arr = arr.filter(function (l) { return String(l).length > 0; });
    box.textContent = arr.length ? arr.join('\n') : '（日志为空）';
    box.scrollTop = box.scrollHeight;
    $('logStamp').textContent = arr.length
      ? (arr.length + ' 行 · ' + (fromSnapshot ? '快照' : '已更新'))
      : (fromSnapshot ? '快照里没有日志' : '日志为空');
  }

  function loadLog() {
    if (!BR.ok) { return Promise.resolve(false); }
    if (state.noRoot) { return Promise.resolve(false); }
    var btn = $('btnLog');
    btn.disabled = true;
    return run('tail -n 40 ' + P.log).then(function (res) {
      renderLog(res.stdout, false);
      $('logStamp').textContent = '最近 40 行 · ' + clock(nowSec());
      return true;
    }).catch(function (err) {
      $('logBox').textContent = '日志读取失败：' + (err.message || err);
      $('logStamp').textContent = '读取失败';
      return false;
    }).then(function () { btn.disabled = false; });
  }

  /* ============================================================
     诊断
     ============================================================ */
  function renderDiag() {
    var d = [];
    d.push(row('桥接对象', esc(BR.ok ? (BR.name + ' · ' + BR.style) : (BR.name || '无'))));
    d.push(row('调用方式', esc(BR.ok ? (STYLE_LABEL[BR.style] || BR.style) : BR.note || '—')));
    d.push(row('最近耗时', esc(BR.latency ? (BR.latency + ' ms') : '—')));
    d.push(row('权限', esc(state.uid === null || state.uid === undefined ? '未知' :
      (state.uid === 0 ? 'root' : 'uid ' + state.uid))));
    d.push(row('模式', esc(state.mode === 'snapshot' ? '只读快照' : '实时')));
    if (!BR.ok && BR.fails) {
      d.push(row('桥接失败', esc(BR.fails + ' 次（连续 ' + BRIDGE_FAIL_LIMIT + ' 次回落只读）')));
    }
    if (state.mode === 'snapshot' && state.snapshotTs) {
      d.push(row('快照时间', esc(clock(state.snapshotTs) + '（' + rel(state.snapshotTs) + '）')));
    }
    d.push(row('配置文件', '<code>' + esc(P.config) + '</code>'));
    d.push(row('状态文件', '<code>' + esc(P.status) + '</code>'));
    d.push(row('轮询', esc(POLL_MS / 1000 + ' 秒（仅页面可见时）')));
    if (BR.ok && BR.style === 'sync') {
      d.push(row('注意', '同步桥接：执行命令时界面会短暂卡住'));
    }
    if (BR.error) { d.push(row('最近错误', esc(BR.error))); }
    $('diag').innerHTML = d.join('');
  }

  /* ============================================================
     杂项
     ============================================================ */
  var toastTimer = null;
  function toast(msg) {
    if (state.mode === 'snapshot' || !BR.ok) { return; }   /* 只读模式别盖掉常驻提示 */
    setBanner(esc(msg), 'info');
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () {
      if (state.mode === 'snapshot' || !BR.ok) { return; }
      $('banner').hidden = true;
    }, 3200);
  }

  function boot() {
    /* 事件绑定 */
    $('btnRefresh').addEventListener('click', function () {
      if (actionBusy('refresh')) { return; }
      beginAction('refresh');
      function done() { endAction('refresh'); }
      if (!BR.ok) {
        /* 快照模式：先重新探测桥接，成功就回实时；仍失败再刷新页面（重新载入快照） */
        if (BR.probing) { done(); return; }
        lastReprobe = Date.now();
        probeBridge().then(function (ok) {
          if (ok) { restoreLive().then(function () { toast('已连接桥接'); }); return; }
          location.reload();
        }).then(done, done);
        return;
      }
      var dirty = refreshDirty();
      refreshStatus().then(function () {
        return dirty ? true : loadConfig();
      }).then(loadLog).then(function () { return loadPatch(false); }).then(function () {
        toast('已刷新');
        done();
      }, done);
    });
    $('btnPatchCheck').addEventListener('click', function () { loadPatch(true); });
    $('btnCheck').addEventListener('click', function () { runFix(true); });
    $('btnFix').addEventListener('click', function () { runFix(false); });
    $('btnPatchApply').addEventListener('click', function () { armPatchAction('apply'); });
    $('btnPatchRestore').addEventListener('click', function () { armPatchAction('restore'); });
    $('btnPatchForce').addEventListener('click', function () { armPatchAction('force'); });
    $('btnPatchConfirmGo').addEventListener('click', confirmPatchAction);
    $('btnPatchConfirmCancel').addEventListener('click', cancelPatchConfirm);
    $('btnRestart').addEventListener('click', function () {
      if (this.getAttribute('data-armed') === '1') {
        this.removeAttribute('data-armed');
        this.textContent = '重启守护';
        restartDaemon();
        return;
      }
      this.setAttribute('data-armed', '1');
      this.textContent = '再点一次确认';
      var self = this;
      setTimeout(function () {
        if (self.getAttribute('data-armed') === '1') {
          self.removeAttribute('data-armed');
          self.textContent = '重启守护';
        }
      }, 4000);
    });
    $('btnApps').addEventListener('click', loadApps);
    $('btnLog').addEventListener('click', loadLog);
    $('cfgSave').addEventListener('click', saveConfig);
    $('cfgDiscard').addEventListener('click', function () {
      if (state.config) { applyConfig(state.config); }
    });
    $('cfgEnabled').addEventListener('change', refreshDirty);
    $('cfgInterval').addEventListener('input', refreshDirty);
    $('cfgMinAge').addEventListener('input', refreshDirty);

    /* banner 里的「重试连接 / 刷新页面」走事件委托，不用内联 onclick */
    $('banner').addEventListener('click', function (ev) {
      var t = ev.target;
      while (t && t !== this && !(t.getAttribute && t.getAttribute('data-action'))) { t = t.parentNode; }
      if (!t || t === this || !t.getAttribute) { return; }
      var act = t.getAttribute('data-action');
      if (act === 'retry-bridge') { retryBridge(); }
      else if (act === 'reload-page') { location.reload(); }
      else if (act === 'patch-apply') { armPatchAction('apply'); }
      else if (act === 'patch-dismiss') { dismissPatchPrompt(); }
      else if (act === 'patch-confirm-go') { confirmPatchAction(); }
      else if (act === 'patch-confirm-cancel') { cancelPatchConfirm(); }
    });

    var segs = $('cfgMode').getElementsByTagName('button');
    for (var i = 0; i < segs.length; i++) {
      segs[i].addEventListener('click', function () {
        var all = $('cfgMode').getElementsByTagName('button');
        for (var j = 0; j < all.length; j++) { all[j].setAttribute('aria-pressed', 'false'); }
        this.setAttribute('aria-pressed', 'true');
        syncModeFields();
        refreshDirty();
      });
    }

    var steps = document.querySelectorAll('.stepper button');
    for (var k = 0; k < steps.length; k++) {
      steps[k].addEventListener('click', function () {
        var input = $(this.getAttribute('data-target'));
        var delta = toInt(this.getAttribute('data-step'), 0);
        var min = toInt(input.getAttribute('min'), 0);
        var max = toInt(input.getAttribute('max'), 0);
        var v = toInt(input.value, min) + delta;
        if (v < min) { v = min; }
        if (v > max) { v = max; }
        input.value = String(v);
        refreshDirty();
      });
    }

    /* 先用手上的快照把界面填上，再去探测桥接（避免冷启动时白屏 7 秒） */
    lockConfig('正在探测 WebUI 桥接…');
    lockActions();
    if (window.__SI_SNAPSHOT__) { snapshotMode(); }

    probeBridge().then(function (ok) {
      if (!ok) {
        $('bridgeName').textContent = BR.note || '无桥接';
        snapshotMode();
        return;
      }
      restoreLive();
    });

    /* 轮询：只在页面可见时读状态；桥接失效时改做重新探测 */
    setInterval(function () {
      if (document.visibilityState !== 'visible') { return; }
      if (state.busy) { return; }
      if (!BR.ok) { maybeReprobe(); return; }
      refreshStatus();
    }, POLL_MS);

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && !BR.ok) { maybeReprobe(); }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
